<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>CHRONO // CALENDAR</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:       #080c10;
  --surface:  #0d1117;
  --surface2: #111820;
  --border:   #1e2d3d;
  --border2:  #243447;
  --accent:   #7dd8f0;
  --danger:   #f28b9a;
  --ok:       #7dddb0;
  --text:     #e6edf3;
  --text2:    #8b949e;
  --text3:    #3d5166;
  --mono:     'JetBrains Mono', 'Courier New', monospace;
}

html { height: 100%; }
body {
  font-family: 'Inter', -apple-system, sans-serif;
  background: var(--bg); color: var(--text);
  height: 100dvh; display: flex; flex-direction: column; overflow: hidden;
  overscroll-behavior: none; touch-action: manipulation;
}

/* TOPBAR */
.topbar {
  display: flex; align-items: center; gap: 12px;
  padding: 0 20px; height: 52px; flex-shrink: 0;
  background: var(--surface); border-bottom: 1px solid var(--border);
}
.logo { font-family: var(--mono); font-size: 13px; font-weight: 500; color: var(--accent); letter-spacing: 2px; white-space: nowrap; }
.logo span { color: var(--text3); }
.today-btn {
  padding: 5px 14px; border: 1px solid var(--border2); border-radius: 3px;
  cursor: pointer; font-size: 11px; font-family: var(--mono); letter-spacing: 1px;
  background: transparent; color: var(--text2); transition: all .15s;
}
.today-btn:hover { border-color: var(--accent); color: var(--accent); }
.nav-btns { display: flex; gap: 2px; }
.menu-btn {
  display: none; width: 30px; height: 30px; border: 1px solid var(--border2); background: none; cursor: pointer;
  border-radius: 3px; font-size: 15px; color: var(--text2); align-items: center; justify-content: center;
}
.nav-btn {
  width: 30px; height: 30px; border: none; background: none; cursor: pointer;
  border-radius: 3px; font-size: 16px; color: var(--text2);
  display: flex; align-items: center; justify-content: center; transition: all .15s;
}
.nav-btn:hover { background: var(--border); color: var(--accent); }
.undo-btn:disabled { opacity: .3; cursor: default; }
.undo-btn:disabled:hover { background: none; color: var(--text2); }
.current-label { font-family: var(--mono); font-size: 13px; color: var(--text); min-width: 220px; letter-spacing: 1px; }
.view-switcher { margin-left: auto; display: flex; border: 1px solid var(--border2); border-radius: 3px; overflow: hidden; }
.view-btn {
  padding: 6px 14px; border: none; background: transparent; cursor: pointer;
  font-size: 10px; font-family: var(--mono); color: var(--text2); letter-spacing: 1px;
  border-left: 1px solid var(--border2); transition: all .15s;
}
.view-btn:first-child { border-left: none; }
.view-btn:hover { color: var(--accent); background: rgba(0,212,255,.05); }
.view-btn.active { background: rgba(0,212,255,.12); color: var(--accent); }

/* LAYOUT */
.calendar-wrap { display: flex; flex: 1; overflow: hidden; }

/* SIDEBAR */
.sidebar {
  width: 220px; padding: 14px 10px; background: var(--surface);
  border-right: 1px solid var(--border); flex-shrink: 0; overflow-y: auto;
}
.new-event-btn {
  display: flex; align-items: center; gap: 8px;
  padding: 9px 14px; margin: 0 4px 16px; width: calc(100% - 8px);
  background: rgba(0,212,255,.08); border: 1px solid rgba(0,212,255,.3);
  border-radius: 3px; cursor: pointer; font-size: 10px;
  font-family: var(--mono); color: var(--accent); letter-spacing: 1px; transition: all .15s;
}
.new-event-btn:hover { background: rgba(0,212,255,.15); border-color: var(--accent); }
.new-event-btn .plus { font-size: 15px; line-height: 1; }

.topbar-create {
  display: flex; align-items: center; gap: 7px;
  padding: 6px 16px 6px 10px; border: 1px solid rgba(0,212,255,.35); border-radius: 16px;
  cursor: pointer; font-size: 11px; font-family: var(--mono); letter-spacing: 1px;
  background: rgba(0,212,255,.08); color: var(--accent); transition: all .15s;
}
.topbar-create:hover { background: rgba(0,212,255,.16); border-color: var(--accent); }
.topbar-create .plus-circle {
  width: 18px; height: 18px; border-radius: 50%; background: var(--accent); color: var(--bg);
  display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; line-height: 1;
}

.cal-list-section { margin-top: 18px; padding-top: 12px; border-top: 1px solid var(--border); }
.cal-list-header { font-size: 9px; color: var(--text3); font-family: var(--mono); letter-spacing: 1px; padding: 0 4px 8px; display: flex; justify-content: space-between; align-items: center; }
.cal-row { display: flex; align-items: center; gap: 8px; padding: 5px 4px; border-radius: 3px; cursor: pointer; transition: background .12s; }
.cal-row:hover { background: var(--surface2); }
.cal-row:hover .cal-del { display: inline-flex; }
.cal-swatch { width: 11px; height: 11px; border-radius: 2px; flex-shrink: 0; cursor: pointer; }
.cal-name { font-size: 11px; color: var(--text2); font-family: var(--mono); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cal-row.off .cal-name { color: var(--text3); text-decoration: line-through; opacity: .5; }
.cal-row.off .cal-swatch { opacity: .25; }
.cal-del { display: none; background: none; border: none; color: var(--text3); font-size: 11px; cursor: pointer; padding: 2px 4px; }
.cal-del:hover { color: var(--danger); }
.add-cal-btn, .import-btn {
  width: 100%; margin-top: 6px; padding: 6px 8px; background: transparent; border: 1px dashed var(--border2);
  border-radius: 3px; color: var(--text2); font-size: 10px; font-family: var(--mono); letter-spacing: .5px; cursor: pointer; transition: all .12s; text-align: left;
}
.add-cal-btn:hover, .import-btn:hover { border-color: var(--accent); color: var(--accent); }

.mini-header { display: flex; align-items: center; justify-content: space-between; padding: 2px 4px; margin-bottom: 6px; }
.mini-month { font-family: var(--mono); font-size: 10px; color: var(--text2); letter-spacing: 1px; }
.mini-nav { background: none; border: none; cursor: pointer; color: var(--text3); font-size: 14px; padding: 2px 5px; border-radius: 2px; transition: all .15s; }
.mini-nav:hover { color: var(--accent); }
.mini-grid { width: 100%; border-collapse: collapse; }
.mini-grid th { font-size: 9px; color: var(--text3); text-align: center; padding: 2px; font-family: var(--mono); }
.mini-grid td { text-align: center; padding: 1px; cursor: pointer; font-size: 10px; color: var(--text2); }
.mini-grid td span { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 2px; transition: all .12s; }
.mini-grid td:hover span { background: var(--border); color: var(--text); }
.mini-grid td.today span { background: rgba(0,212,255,.2); color: var(--accent); }
.mini-grid td.selected span { background: rgba(0,212,255,.12); color: var(--accent); outline: 1px solid rgba(0,212,255,.4); }
.mini-grid td.other-month { opacity: .3; }

/* MAIN */
.main-view { flex: 1; overflow: auto; background: var(--bg); }

/* MONTH */
.month-view { height: 100%; display: flex; flex-direction: column; }
.month-dow-header { display: grid; grid-template-columns: repeat(7, 1fr); border-bottom: 1px solid var(--border); }
.month-dow-header div { padding: 8px 10px; text-align: right; font-size: 9px; color: var(--text3); font-family: var(--mono); letter-spacing: 1px; }
.month-grid { flex: 1; display: grid; grid-template-columns: repeat(7, 1fr); grid-auto-rows: 1fr; border-left: 1px solid var(--border); }
.month-cell { border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); padding: 4px; min-height: 120px; cursor: pointer; position: relative; transition: background .1s; }
.month-cell:hover { background: var(--surface2); }
.month-cell.other-month .day-num { color: var(--text3); }
.month-cell.today .day-num span { background: var(--accent); color: var(--bg); border-radius: 2px; width: 22px; height: 22px; display: inline-flex; align-items: center; justify-content: center; }
.day-num { font-size: 10px; font-family: var(--mono); color: var(--text2); text-align: right; padding: 2px 4px 4px; }
.month-event { background: #7dd8f0; color: #080c10; border-left: none; border-radius: 3px; padding: 2px 6px; font-size: 10px; margin: 1px 0; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: var(--mono); font-weight: 600; transition: opacity .1s; }
.month-event:hover { opacity: .85; }
.month-event.ev-green  { background: #7dddb0; color: #080c10; }
.month-event.ev-red    { background: #f28b9a; color: #fff; }
.month-event.ev-yellow { background: #f5d57a; color: #080c10; }
.month-event.ev-purple { background: #c4b0f7; color: #080c10; }
.month-event.ev-teal   { background: #a8b8e8; color: #080c10; }
.month-event.ev-orange { background: #f5b07a; color: #080c10; }
.month-event.ev-lime   { background: #d8f07a; color: #080c10; }
.month-event.ev-pink   { background: #f7c8e0; color: #080c10; }

/* WEEK */
.week-view { display: flex; flex-direction: column; height: 100%; }
.week-header-row { display: grid; grid-template-columns: 56px repeat(7, 1fr); border-bottom: 1px solid var(--border); flex-shrink: 0; background: var(--surface); }
.week-header-cell { text-align: center; padding: 8px 4px; border-left: 1px solid var(--border); }
.week-header-cell .dow { font-size: 9px; color: var(--text3); font-family: var(--mono); letter-spacing: 1px; }
.week-header-cell .wdate { font-size: 20px; font-weight: 300; color: var(--text2); line-height: 1.4; display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 3px; cursor: pointer; font-family: var(--mono); transition: all .12s; }
.week-header-cell .wdate:hover { background: var(--border); color: var(--text); }
.week-header-cell.today .wdate { background: rgba(0,212,255,.15); color: var(--accent); outline: 1px solid rgba(0,212,255,.4); }
.week-time-grid { flex: 1; overflow-y: auto; display: grid; grid-template-columns: 56px repeat(7, 1fr); position: relative; }
.time-labels { display: flex; flex-direction: column; }
.time-label { height: var(--hh, 64px); display: flex; align-items: flex-start; justify-content: flex-end; padding-right: 8px; font-size: 9px; color: var(--text3); font-family: var(--mono); flex-shrink: 0; padding-top: 3px; }
.week-day-col { border-left: 1px solid var(--border); position: relative; cursor: pointer; }
.hour-line { height: var(--hh, 64px); border-bottom: 1px solid rgba(30,45,61,.7); }
.week-event { position: absolute; left: 2px; right: 2px; border-left: none; background: #7dd8f0; color: #080c10; border-radius: 3px; padding: 2px 4px; font-size: 10px; cursor: pointer; overflow: hidden; z-index: 1; font-family: var(--mono); font-weight: 600; transition: opacity .1s; }
.week-event { border: 1px solid rgba(0,0,0,.35); box-shadow: 0 1px 2px rgba(0,0,0,.4); display: flex; flex-direction: column; }
.week-event .ev-time { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.2; }
.week-event .ev-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.2; }
.week-event:hover { opacity: .85; }
.week-event.ev-green  { background: #7dddb0; color: #080c10; }
.week-event.ev-red    { background: #f28b9a; color: #fff; }
.week-event.ev-yellow { background: #f5d57a; color: #080c10; }
.week-event.ev-purple { background: #c4b0f7; color: #080c10; }
.week-event.ev-teal   { background: #a8b8e8; color: #080c10; }
.week-event.ev-orange { background: #f5b07a; color: #080c10; }
.week-event.ev-lime   { background: #d8f07a; color: #080c10; }
.week-event.ev-pink   { background: #f7c8e0; color: #080c10; }
/* ALL-DAY STRIP (Google Calendar style) */
.allday-row { display: flex; border-bottom: 1px solid var(--border); flex-shrink: 0; background: var(--surface); min-height: 22px; max-height: 120px; overflow-y: auto; }
.allday-label { width: 56px; flex-shrink: 0; display: flex; align-items: flex-start; justify-content: flex-end; padding: 4px 8px 0 0; font-size: 8px; color: var(--text3); font-family: var(--mono); letter-spacing: 1px; }
.allday-track { flex: 1; position: relative; min-height: 20px; border-left: 1px solid var(--border); cursor: cell; }
.allday-track:hover { background: rgba(125,216,240,.04); }
.allday-cell { padding: 2px 3px; min-height: 20px; display: flex; flex-direction: column; gap: 1px; }
.allday-span { position: absolute; height: 18px; line-height: 18px; background: #7dd8f0; color: #080c10; border-radius: 3px; padding: 0 6px; font-size: 10px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: var(--mono); font-weight: 600; transition: opacity .1s; border: 1px solid rgba(0,0,0,.35); box-shadow: 0 1px 2px rgba(0,0,0,.4); z-index: 2; }
.allday-span:hover { opacity: .85; }
.allday-span.span-start { border-top-left-radius: 3px; border-bottom-left-radius: 3px; }
.allday-span:not(.span-start) { border-top-left-radius: 0; border-bottom-left-radius: 0; border-left: none; }
.allday-span:not(.span-end) { border-top-right-radius: 0; border-bottom-right-radius: 0; border-right: none; }
.allday-span.ev-green  { background: #7dddb0; color: #080c10; }
.allday-span.ev-red    { background: #f28b9a; color: #fff; }
.allday-span.ev-yellow { background: #f5d57a; color: #080c10; }
.allday-span.ev-purple { background: #c4b0f7; color: #080c10; }
.allday-span.ev-teal   { background: #a8b8e8; color: #080c10; }
.allday-span.ev-orange { background: #f5b07a; color: #080c10; }
.allday-span.ev-lime   { background: #d8f07a; color: #080c10; }
.allday-span.ev-pink   { background: #f7c8e0; color: #080c10; }
.allday-event { background: #7dd8f0; color: #080c10; border-radius: 3px; padding: 2px 6px; font-size: 10px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: var(--mono); font-weight: 600; transition: opacity .1s; border: 1px solid rgba(0,0,0,.35); box-shadow: 0 1px 2px rgba(0,0,0,.4); }
.allday-event:hover { opacity: .85; }
.allday-event.ev-green  { background: #7dddb0; color: #080c10; }
.allday-event.ev-red    { background: #f28b9a; color: #fff; }
.allday-event.ev-yellow { background: #f5d57a; color: #080c10; }
.allday-event.ev-purple { background: #c4b0f7; color: #080c10; }
.allday-event.ev-teal   { background: #a8b8e8; color: #080c10; }
.allday-event.ev-orange { background: #f5b07a; color: #080c10; }
.allday-event.ev-lime   { background: #d8f07a; color: #080c10; }
.allday-event.ev-pink   { background: #f7c8e0; color: #080c10; }
.now-line { position: absolute; left: 0; right: 0; border-top: 1px solid var(--danger); z-index: 2; opacity: .8; }
/* DRAG GHOST — the clone that follows the cursor; original block hides while dragging
   so the live grid is never mutated mid-drag (kills the screen flash). */
.drag-ghost { pointer-events: none !important; z-index: 40 !important; opacity: .92; box-shadow: 0 4px 14px rgba(0,0,0,.55); margin: 0; }
.drag-origin-hidden { visibility: hidden !important; }
/* LONG-PRESS (touch): subtle glow while the hold charges, stronger once armed */
.lp-hold { box-shadow: 0 0 0 1px var(--accent), 0 0 10px rgba(0,212,255,.35) !important; transition: box-shadow .55s linear; }
.lp-armed { box-shadow: 0 0 0 2px var(--accent), 0 0 16px rgba(0,212,255,.6) !important; }
.now-line::before { content: ''; position: absolute; left: -4px; top: -4px; width: 7px; height: 7px; background: var(--danger); border-radius: 50%; }

/* DAY */
.day-view { display: flex; flex-direction: column; height: 100%; }
.day-header { text-align: center; padding: 10px; border-bottom: 1px solid var(--border); flex-shrink: 0; background: var(--surface); }
.day-header .dow { font-size: 9px; color: var(--text3); font-family: var(--mono); letter-spacing: 2px; }
.day-header .ddate { font-size: 32px; font-weight: 300; color: var(--text2); line-height: 1.2; display: inline-flex; align-items: center; justify-content: center; width: 52px; height: 52px; border-radius: 4px; font-family: var(--mono); }
.day-header.today .ddate { background: rgba(0,212,255,.12); color: var(--accent); outline: 1px solid rgba(0,212,255,.3); }
.day-time-grid { flex: 1; overflow-y: auto; display: grid; grid-template-columns: 56px 1fr; position: relative; }
.day-col { border-left: 1px solid var(--border); position: relative; cursor: pointer; }
.day-event { position: absolute; left: 4px; right: 4px; border-left: none; background: #7dd8f0; color: #080c10; border-radius: 3px; padding: 4px 8px; font-size: 11px; cursor: pointer; overflow: hidden; z-index: 1; font-family: var(--mono); font-weight: 600; transition: opacity .1s; }
.day-event { border: 1px solid rgba(0,0,0,.35); box-shadow: 0 1px 2px rgba(0,0,0,.4); }
.week-event[data-drag-id], .day-event[data-drag-id] { cursor: grab; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: none; }
.week-event[data-drag-id]:active, .day-event[data-drag-id]:active { cursor: grabbing; opacity: .9; z-index: 5; }
.day-event:hover { opacity: .85; }
.day-event.ev-green  { background: #7dddb0; color: #080c10; }
.day-event.ev-red    { background: #f28b9a; color: #fff; }
.day-event.ev-yellow { background: #f5d57a; color: #080c10; }
.day-event.ev-purple { background: #c4b0f7; color: #080c10; }
.day-event.ev-teal   { background: #a8b8e8; color: #080c10; }
.day-event.ev-orange { background: #f5b07a; color: #080c10; }
.day-event.ev-lime   { background: #d8f07a; color: #080c10; }
.day-event.ev-pink   { background: #f7c8e0; color: #080c10; }

/* MODAL */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.75); backdrop-filter: blur(4px); z-index: 100; align-items: center; justify-content: center; }
.modal-overlay.open { display: flex; }
.modal { background: var(--surface); border: 1px solid var(--border2); border-radius: 4px; width: 500px; max-width: 95vw; box-shadow: 0 20px 60px rgba(0,0,0,.8); overflow: hidden; }
.modal-header { display: flex; align-items: center; padding: 14px 20px 12px; gap: 10px; border-bottom: 1px solid var(--border); }
.modal-header h3 { font-size: 12px; font-weight: 500; font-family: var(--mono); color: var(--accent); letter-spacing: 1px; flex: 1; }
.modal-close { background: none; border: none; cursor: pointer; font-size: 15px; color: var(--text3); padding: 4px 8px; border-radius: 2px; transition: all .12s; }
.modal-close:hover { color: var(--danger); }
.modal-body { padding: 16px 20px; }
.form-row { margin-bottom: 13px; }
.form-row label { display: block; font-size: 9px; color: var(--text3); margin-bottom: 5px; font-family: var(--mono); letter-spacing: 1px; }
.form-row input, .form-row textarea, .form-row select { width: 100%; padding: 7px 10px; border: 1px solid var(--border); border-radius: 3px; font-size: 12px; color: var(--text); background: var(--bg); outline: none; font-family: var(--mono); transition: border-color .15s; }
.form-row input:focus, .form-row textarea:focus, .form-row select:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(0,212,255,.08); }
.form-row textarea { resize: vertical; min-height: 54px; }
.form-row select option { background: var(--surface2); }
.form-row-inline { display: flex; gap: 12px; }
.form-row-inline .form-row { flex: 1; }

.recur-section { margin-bottom: 13px; }
.recur-section > label { display: block; font-size: 9px; color: var(--text3); margin-bottom: 6px; font-family: var(--mono); letter-spacing: 1px; }
.recur-opts { display: flex; gap: 5px; flex-wrap: wrap; }
.recur-opt { padding: 5px 11px; border: 1px solid var(--border); border-radius: 2px; font-size: 10px; font-family: var(--mono); color: var(--text2); cursor: pointer; transition: all .12s; background: transparent; letter-spacing: .5px; }
.recur-opt:hover { border-color: var(--border2); color: var(--text); }
.recur-opt.active { border-color: var(--accent); color: var(--accent); background: rgba(0,212,255,.08); }
.recur-end-row { margin-top: 8px; display: none; }
.recur-end-row.show { display: block; }

.weekly-days-row { margin-top: 8px; display: none; }
.weekly-days-row.show { display: block; }
.weekly-days-row > label { display: block; font-size: 9px; color: var(--text3); margin-bottom: 6px; font-family: var(--mono); letter-spacing: 1px; }
.weekly-day-btns { display: flex; gap: 5px; }
.weekly-day-btn { flex: 1; padding: 6px 2px; border: 1px solid var(--border); border-radius: 2px; font-size: 9px; font-family: var(--mono); color: var(--text2); cursor: pointer; background: transparent; letter-spacing: .5px; transition: all .12s; text-align: center; }
.weekly-day-btn:hover { border-color: var(--border2); color: var(--text); }
.weekly-day-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(0,212,255,.08); }

.category-picker { display: flex; gap: 6px; flex-wrap: wrap; }
.cat-btn {
  display: flex; align-items: center; gap: 6px;
  padding: 6px 11px; border: 1px solid var(--border); border-radius: 2px;
  font-size: 9px; font-family: var(--mono); letter-spacing: 1px;
  color: var(--text2); background: transparent; cursor: pointer; transition: all .12s;
}
.cat-btn:hover { border-color: var(--border2); color: var(--text); }
.cat-btn.active { color: #fff; }
.cat-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.legend { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--border); }
.legend-title { font-size: 9px; color: var(--text3); font-family: var(--mono); letter-spacing: 1px; margin-bottom: 8px; padding: 0 4px; }
.legend-item { display: flex; align-items: center; gap: 8px; padding: 3px 4px; font-size: 10px; font-family: var(--mono); color: var(--text2); }
.legend-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

.modal-footer { display: flex; justify-content: flex-end; gap: 8px; padding: 10px 20px 14px; border-top: 1px solid var(--border); }
.btn { padding: 7px 16px; border-radius: 3px; font-size: 10px; cursor: pointer; font-weight: 500; border: none; font-family: var(--mono); letter-spacing: 1px; transition: all .15s; }
.btn-ghost { background: transparent; color: var(--text2); border: 1px solid var(--border); }
.btn-ghost:hover { border-color: var(--border2); color: var(--text); }
.btn-primary { background: rgba(0,212,255,.12); color: var(--accent); border: 1px solid rgba(0,212,255,.4); }
.btn-primary:hover { background: rgba(0,212,255,.22); border-color: var(--accent); }
.btn-danger { background: rgba(255,59,92,.1); color: var(--danger); border: 1px solid rgba(255,59,92,.35); }
.btn-danger:hover { background: rgba(255,59,92,.2); }

/* RECUR DIALOG */
.recur-dialog { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.8); backdrop-filter: blur(4px); z-index: 110; align-items: center; justify-content: center; }
.recur-dialog.open { display: flex; }
.recur-box { background: var(--surface); border: 1px solid var(--border2); border-radius: 4px; padding: 24px; width: 320px; box-shadow: 0 20px 60px rgba(0,0,0,.9); }
.recur-box h4 { font-family: var(--mono); font-size: 11px; color: var(--accent); letter-spacing: 1px; margin-bottom: 16px; }
.recur-choices { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
.recur-choices label { display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 11px; color: var(--text2); font-family: var(--mono); padding: 8px 10px; border: 1px solid var(--border); border-radius: 3px; transition: all .12s; }
.recur-choices label:hover { border-color: var(--border2); color: var(--text); }
.recur-choices input[type=radio] { accent-color: var(--accent); }
.recur-actions { display: flex; justify-content: flex-end; gap: 8px; }

/* DETAIL */
.detail-popup { display: none; position: fixed; z-index: 90; background: var(--surface); border: 1px solid var(--border2); border-radius: 4px; box-shadow: 0 8px 40px rgba(0,0,0,.8); width: 270px; overflow: hidden; }
.detail-popup.open { display: block; }
.detail-top { padding: 8px 10px; display: flex; justify-content: flex-end; gap: 4px; border-bottom: 1px solid var(--border); }
.detail-top button { background: none; border: none; cursor: pointer; color: var(--text3); padding: 4px 7px; border-radius: 2px; font-size: 12px; transition: all .12s; }
.detail-top button:hover { color: var(--accent); background: var(--border); }
.detail-top button.del:hover { color: var(--danger); }
.detail-body { padding: 12px 14px 14px; }
.detail-title { font-size: 14px; font-weight: 500; margin-bottom: 7px; display: flex; align-items: center; gap: 8px; font-family: var(--mono); color: var(--text); }
.detail-color-bar { width: 3px; height: 16px; border-radius: 1px; flex-shrink: 0; }
.detail-time { font-size: 10px; color: var(--text2); margin-bottom: 3px; font-family: var(--mono); }
.detail-recur { font-size: 10px; color: var(--accent); font-family: var(--mono); margin-bottom: 3px; }
.detail-cat { font-size: 9px; font-family: var(--mono); letter-spacing: 1px; margin-bottom: 3px; opacity: .6; }
.detail-desc { font-size: 10px; color: var(--text3); white-space: pre-wrap; }
.detail-actions { display: flex; gap: 6px; padding: 10px 14px 14px; }
.detail-actions button { flex: 1; padding: 8px 10px; font-family: var(--mono); font-size: 10px; letter-spacing: 1px; cursor: pointer; border-radius: 3px; border: 1px solid var(--border2); background: var(--surface2); color: var(--text2); transition: all .12s; }
.detail-actions button:hover { border-color: var(--accent); color: var(--accent); }
.detail-actions button.detail-del { border-color: rgba(242,139,154,.35); color: #f28b9a; }
.detail-actions button.detail-del:hover { background: rgba(242,139,154,.15); border-color: #f28b9a; color: #f28b9a; }

/* CUSTOM DAY PICKER */
.custom-day-grid { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; }
.custom-day-btn {
  flex: 1; min-width: 44px; padding: 10px 4px; border: 1px solid var(--border);
  border-radius: 3px; background: transparent; color: var(--text2);
  font-size: 10px; font-family: var(--mono); letter-spacing: 1px; cursor: pointer;
  transition: all .15s;
}
.custom-day-btn:hover { border-color: var(--border2); color: var(--text); }
.custom-day-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(0,212,255,.1); }
.custom-presets { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.preset-label { font-size: 9px; color: var(--text3); font-family: var(--mono); letter-spacing: 1px; }

::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }
::-webkit-scrollbar-thumb:hover { background: var(--text3); }

/* ============ MOBILE (phone / narrow screens) ============ */
@media (max-width: 820px) {
  /* topbar: collapse to two rows, kill horizontal crush */
  .topbar { flex-wrap: wrap; height: auto; padding: 6px 10px; gap: 6px; row-gap: 6px; }
  .logo { font-size: 12px; }
  .current-label { min-width: 0; flex: 1 1 100%; order: 3; font-size: 12px; text-align: center; }
  .view-switcher { margin-left: 0; order: 4; flex: 1 1 100%; display: flex; overflow-x: auto; }
  .view-btn { flex: 1; padding: 8px 6px; font-size: 11px; }
  #timeFmt, #hourZoom { display: none; }
  .topbar-create { padding: 5px 12px 5px 8px; }
  .today-btn { padding: 5px 10px; }

  /* sidebar: hidden by default, slides over as a drawer via the ☰ button */
  .menu-btn { display: inline-flex !important; }
  .sidebar {
    position: fixed; left: 0; top: 0; bottom: 0; z-index: 80; width: 260px;
    transform: translateX(-100%); transition: transform .22s ease; box-shadow: none;
  }
  .sidebar.open { transform: translateX(0); box-shadow: 12px 0 40px rgba(0,0,0,.6); }
  .main-view { width: 100%; }

  /* month cells shrink to phone height */
  .month-cell { min-height: 72px; padding: 2px; }
  .month-event { font-size: 9px; padding: 1px 4px; }
  .day-num { font-size: 9px; }

  /* week / day grids: narrower time gutter, tighter blocks */
  .week-header-row, .week-time-grid { grid-template-columns: 34px repeat(7, minmax(0,1fr)); }
  .day-time-grid { grid-template-columns: 34px 1fr; }
  .time-label { font-size: 8px; padding-right: 4px; }
  .allday-label { width: 34px; padding-right: 4px; }
  .week-header-cell .wdate { font-size: 15px; width: 26px; height: 26px; }
  .week-header-cell .dow { font-size: 8px; }
  .week-event { padding: 1px 2px; font-size: 8px; left: 1px; right: 1px; }
  .week-event .ev-name { display: none; }
  .week-event .ev-time { font-size: 8px; }
  .day-event { font-size: 10px; }

  /* popup + modal: fit the screen, never overflow */
  .detail-popup { width: 86vw; max-width: 86vw; }
  .modal { max-height: 92dvh; display: flex; flex-direction: column; }
  .modal-body { overflow-y: auto; }

  /* stats / custom views get their own scroll */
  .main-view > * { min-width: 0; }
}
</style>
</head>
<body>

<div class="topbar">
  <button class="menu-btn" onclick="toggleSidebar()" title="Menu">&#9776;</button>
  <div class="logo">CHRONO<span> //</span></div>
  <div class="topbar-create" onclick="openNewEvent()"><span class="plus-circle">+</span> CREATE</div>
  <button class="today-btn" onclick="goToday()">TODAY</button>
  <div class="nav-btns">
    <button class="nav-btn" onclick="navPrev()">&#8249;</button>
    <button class="nav-btn" onclick="navNext()">&#8250;</button>
  </div>
   <div class="nav-btns" style="margin-left:6px;border-left:1px solid var(--border2);padding-left:6px">
     <button class="nav-btn undo-btn" id="btnUndo" onclick="doUndo()" title="Undo (Ctrl+Z)">&#8630;</button>
     <button class="nav-btn undo-btn" id="btnRedo" onclick="doRedo()" title="Redo (Ctrl+Y)">&#8631;</button>
   </div>
   <select id="timeFmt" onchange="setTimeFmt(this.value)" title="Time format" style="margin-left:8px;background:var(--surface2);color:var(--text2);border:1px solid var(--border2);border-radius:3px;font-family:var(--mono);font-size:10px;letter-spacing:1px;padding:5px 8px;cursor:pointer"><option value="12">12H</option><option value="24">24H</option></select>
   <select id="hourZoom" onchange="setHourZoom(this.value)" title="Time grid height" style="margin-left:8px;background:var(--surface2);color:var(--text2);border:1px solid var(--border2);border-radius:3px;font-family:var(--mono);font-size:10px;letter-spacing:1px;padding:5px 8px;cursor:pointer">
     <option value="auto">AUTO</option>
     <option value="48">COMPACT</option>
     <option value="64">NORMAL</option>
     <option value="80">TALL</option>
     <option value="160">XL</option>
   </select>
  <div class="current-label" id="currentLabel"></div>
  <div class="view-switcher">
    <button class="view-btn" id="btn-day"    onclick="setView('day')">DAY</button>
    <button class="view-btn active" id="btn-week"   onclick="setView('week')">WEEK</button>
    <button class="view-btn" id="btn-month"  onclick="setView('month')">MONTH</button>
    <button class="view-btn" id="btn-custom" onclick="setView('custom')">CUSTOM</button>
    <button class="view-btn" id="btn-stats" onclick="setView('stats')">STATS</button>
    <button class="view-btn" id="btn-custom-cfg" onclick="openCustomCfg()" title="Configure days" style="padding:6px 10px;border-left:1px solid var(--border2)">&#9881;</button>
  </div>
</div>

<div class="calendar-wrap">
  <div class="sidebar">
    <button class="new-event-btn" onclick="openNewEvent()"><span class="plus">+</span> NEW EVENT</button>
    <div id="miniCal"></div>
    <div class="cal-list-section">
      <div class="cal-list-header"><span>MY CALENDARS</span></div>
      <div id="calList"></div>
      <button class="add-cal-btn" onclick="promptNewCalendar()">+ NEW CALENDAR</button>
      <button class="import-btn" onclick="importHolidays()">&#8681; IMPORT US HOLIDAYS 2026</button>
      <button class="import-btn" onclick="importLiberty()">&#8681; IMPORT LIBERTY SCHEDULE 2026</button>
      <button class="import-btn" onclick="exportData()">&#8679; EXPORT EVENTS (JSON)</button>
      <button class="import-btn" onclick="document.getElementById('importFile').click()">&#8681; IMPORT EVENTS (JSON)</button>
      <input type="file" id="importFile" accept=".json,application/json" style="display:none" onchange="importDataFile(this)">
    </div>
    <div class="cal-list-section">
      <div class="cal-list-header"><span>CLOUD SYNC</span><span id="syncDot" style="font-size:8px;color:var(--text3)">OFF</span></div>
      <div style="padding:0 4px 6px;font-size:9px;color:var(--text3);font-family:var(--mono);line-height:1.5">Sync events between phone &amp; PC via your private GitHub repo.</div>
      <div style="padding:0 4px 6px"><input type="password" id="syncToken" placeholder="GitHub PAT token" style="width:100%;padding:6px 8px;border:1px solid var(--border);border-radius:3px;font-size:10px;color:var(--text);background:var(--bg);outline:none;font-family:var(--mono)"></div>
      <button class="add-cal-btn" id="syncBtn" onclick="syncConnect()">CONNECT SYNC</button>
      <button class="import-btn" id="syncNowBtn" onclick="syncNow()" style="display:none">&#8635; SYNC NOW</button>
      <div id="syncStatus" style="padding:4px;font-size:9px;color:var(--text2);font-family:var(--mono);min-height:14px"></div>
    </div>
    <div class="legend">
      <div class="legend-title">// CATEGORIES</div>
      <div class="legend-item"><div class="legend-dot" style="background:#7dd8f0"></div>WORK</div>
      <div class="legend-item"><div class="legend-dot" style="background:#7dddb0"></div>PERSONAL</div>
      <div class="legend-item"><div class="legend-dot" style="background:#f5b07a"></div>FITNESS</div>
      <div class="legend-item"><div class="legend-dot" style="background:#f5d57a"></div>TRAVEL</div>
      <div class="legend-item"><div class="legend-dot" style="background:#a8b8e8"></div>SLEEP</div>
      <div class="legend-item"><div class="legend-dot" style="background:#c4b0f7"></div>FINANCE</div>
      <div class="legend-item"><div class="legend-dot" style="background:#d8f07a"></div>MEALS</div>
      <div class="legend-item"><div class="legend-dot" style="background:#f7c8e0"></div>HYGIENE</div>
      <div class="legend-item"><div class="legend-dot" style="background:#f28b9a"></div>SOCIAL</div>
    </div>
  </div>
  <div class="main-view" id="mainView"></div>
</div>

<!-- CUSTOM VIEW CONFIG MODAL -->
<div class="modal-overlay" id="customCfgOverlay" onclick="closeCustomCfgOverlay(event)">
  <div class="modal" style="width:380px">
    <div class="modal-header">
      <h3>// CUSTOM VIEW — SELECT DAYS</h3>
      <button class="modal-close" onclick="closeCustomCfg()">&#x2715;</button>
    </div>
    <div class="modal-body">
      <div class="form-row"><label>CHOOSE WHICH DAYS TO DISPLAY</label></div>
      <div class="custom-day-grid" id="customDayGrid">
        <button class="custom-day-btn" data-d="0">SUN</button>
        <button class="custom-day-btn" data-d="1">MON</button>
        <button class="custom-day-btn" data-d="2">TUE</button>
        <button class="custom-day-btn" data-d="3">WED</button>
        <button class="custom-day-btn" data-d="4">THU</button>
        <button class="custom-day-btn" data-d="5">FRI</button>
        <button class="custom-day-btn" data-d="6">SAT</button>
      </div>
      <div class="custom-presets">
        <span class="preset-label">PRESETS:</span>
        <button class="btn btn-ghost" style="font-size:9px;padding:4px 10px" onclick="applyPreset([1,2,3,4,5])">MON–FRI</button>
        <button class="btn btn-ghost" style="font-size:9px;padding:4px 10px" onclick="applyPreset([1,2,3,4,5,6])">MON–SAT</button>
        <button class="btn btn-ghost" style="font-size:9px;padding:4px 10px" onclick="applyPreset([0,1,2,3,4,5,6])">ALL</button>
        <button class="btn btn-ghost" style="font-size:9px;padding:4px 10px" onclick="applyPreset([0,6])">WEEKENDS</button>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeCustomCfg()">CANCEL</button>
      <button class="btn btn-primary" onclick="saveCustomCfg()">APPLY</button>
    </div>
  </div>
</div>

<!-- EVENT MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModalOverlay(event)">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modalTitle">// NEW EVENT</h3>
      <button class="modal-close" onclick="closeModal()">&#x2715;</button>
    </div>
    <div class="modal-body">
      <div class="form-row">
        <label>TITLE</label>
        <input type="text" id="evTitle" placeholder="Event title" />
      </div>
      <div class="form-row">
        <label>CALENDAR</label>
        <select id="evCalendar"></select>
      </div>
      <div class="form-row-inline">
        <div class="form-row">
          <label>DATE</label>
          <input type="date" id="evDate" />
        </div>
        <div class="form-row">
          <label>ALL DAY</label>
          <select id="evAllDay" onchange="toggleTime()">
            <option value="no">No</option>
            <option value="yes">Yes</option>
          </select>
        </div>
      </div>
      <div id="timeRow" class="form-row-inline">
        <div class="form-row"><label>START</label><input type="time" id="evStart" value="09:00" /></div>
        <div class="form-row"><label>END</label><input type="time" id="evEnd" value="10:00" /></div>
      </div>
      <div id="durRow" class="form-row">
        <label>DURATION — pick one, or set CUSTOM hours/minutes (auto-fills END from START)</label>
        <div class="recur-opts" id="durOpts">
          <button type="button" class="recur-opt" onclick="setDur(this,30)">30M</button>
          <button type="button" class="recur-opt" onclick="setDur(this,45)">45M</button>
          <button type="button" class="recur-opt" onclick="setDur(this,60)">1H</button>
          <button type="button" class="recur-opt" onclick="setDur(this,90)">1H30M</button>
          <button type="button" class="recur-opt" onclick="setDur(this,120)">2H</button>
          <button type="button" class="recur-opt" onclick="setDur(this,180)">3H</button>
          <button type="button" class="recur-opt" onclick="setDur(this,240)">4H</button>
          <button type="button" class="recur-opt" onclick="setDur(this,'custom')">CUSTOM</button>
        </div>
        <div class="form-row-inline" id="durCustomRow" style="display:none;margin-top:8px">
          <div class="form-row"><label>HOURS</label><input type="number" id="durH" min="0" max="23" value="1" oninput="applyCustomDur()" /></div>
          <div class="form-row"><label>MINUTES</label><input type="number" id="durM" min="0" max="59" step="5" value="0" oninput="applyCustomDur()" /></div>
        </div>
      </div>
      <div id="allDayEndRow" class="form-row" style="display:none">
        <label>ENDS (optional — leave blank for one day)</label>
        <input type="date" id="evAllDayEnd" />
      </div>
      <div class="recur-section">
        <label>REPEAT</label>
        <div class="recur-opts">
          <button class="recur-opt active" data-r="none"    onclick="setRecur(this)">NONE</button>
          <button class="recur-opt"        data-r="daily"   onclick="setRecur(this)">DAILY</button>
          <button class="recur-opt"        data-r="weekly"  onclick="setRecur(this)">WEEKLY</button>
          <button class="recur-opt"        data-r="monthly" onclick="setRecur(this)">MONTHLY</button>
          <button class="recur-opt"        data-r="yearly"  onclick="setRecur(this)">YEARLY</button>
        </div>
        <div class="recur-end-row" id="recurEndRow">
          <div class="form-row" style="margin-top:8px;margin-bottom:0">
            <label>END DATE (optional)</label>
            <input type="date" id="evRecurEnd" />
          </div>
        </div>
        <div class="weekly-days-row" id="weeklyDaysRow">
          <label>REPEAT ON</label>
          <div class="weekly-day-btns">
            <button type="button" class="weekly-day-btn" data-wd="0">SUN</button>
            <button type="button" class="weekly-day-btn" data-wd="1">MON</button>
            <button type="button" class="weekly-day-btn" data-wd="2">TUE</button>
            <button type="button" class="weekly-day-btn" data-wd="3">WED</button>
            <button type="button" class="weekly-day-btn" data-wd="4">THU</button>
            <button type="button" class="weekly-day-btn" data-wd="5">FRI</button>
            <button type="button" class="weekly-day-btn" data-wd="6">SAT</button>
          </div>
        </div>
      </div>
      <div class="form-row"><label>NOTES</label><textarea id="evDesc" placeholder="Add notes..."></textarea></div>
      <div class="form-row">
        <label>CATEGORY</label>
        <div class="category-picker" id="categoryPicker">
          <button type="button" class="cat-btn active" data-cat="" data-hex="#7dd8f0" onclick="pickCat(this)"><span class="cat-dot" style="background:#7dd8f0"></span>WORK</button>
          <button type="button" class="cat-btn" data-cat="ev-green"  data-hex="#7dddb0" onclick="pickCat(this)"><span class="cat-dot" style="background:#7dddb0"></span>PERSONAL</button>
          <button type="button" class="cat-btn" data-cat="ev-orange" data-hex="#f5b07a" onclick="pickCat(this)"><span class="cat-dot" style="background:#f5b07a"></span>FITNESS</button>
          <button type="button" class="cat-btn" data-cat="ev-yellow" data-hex="#f5d57a" onclick="pickCat(this)"><span class="cat-dot" style="background:#f5d57a"></span>TRAVEL</button>
          <button type="button" class="cat-btn" data-cat="ev-teal"   data-hex="#a8b8e8" onclick="pickCat(this)"><span class="cat-dot" style="background:#a8b8e8"></span>SLEEP</button>
          <button type="button" class="cat-btn" data-cat="ev-purple" data-hex="#c4b0f7" onclick="pickCat(this)"><span class="cat-dot" style="background:#c4b0f7"></span>FINANCE</button>
          <button type="button" class="cat-btn" data-cat="ev-lime"   data-hex="#d8f07a" onclick="pickCat(this)"><span class="cat-dot" style="background:#d8f07a"></span>MEALS</button>
          <button type="button" class="cat-btn" data-cat="ev-pink"   data-hex="#f7c8e0" onclick="pickCat(this)"><span class="cat-dot" style="background:#f7c8e0"></span>HYGIENE</button>
          <button type="button" class="cat-btn" data-cat="ev-red"    data-hex="#f28b9a" onclick="pickCat(this)"><span class="cat-dot" style="background:#f28b9a"></span>SOCIAL</button>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-danger" id="deleteBtn" onclick="onDeleteClick()" style="display:none;margin-right:auto">DELETE</button>
      <button class="btn btn-ghost" onclick="closeModal()">CANCEL</button>
      <button class="btn btn-primary" onclick="saveEvent()">SAVE</button>
    </div>
  </div>
</div>

<!-- RECUR SCOPE DIALOG -->
<div class="recur-dialog" id="recurDialog">
  <div class="recur-box">
    <h4>// EDIT RECURRING EVENT</h4>
    <div class="recur-choices">
      <label><input type="radio" name="recurScope" value="this" checked> This occurrence only</label>
      <label><input type="radio" name="recurScope" value="all"> All events in series</label>
    </div>
    <div class="recur-actions">
      <button class="btn btn-ghost" onclick="closeRecurDialog()">CANCEL</button>
      <button class="btn btn-primary" onclick="confirmRecurAction()">CONFIRM</button>
    </div>
  </div>
</div>

<!-- DETAIL POPUP -->
<div class="detail-popup" id="detailPopup">
  <div class="detail-top">
    <button onclick="editFromDetail()" title="Edit">&#9998;</button>

<script>
const DAYS   = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
const WDAYS  = ['MON','TUE','WED','THU','FRI','SAT','SUN'];
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const COLOR_HEX = { '':'#7dd8f0','ev-green':'#7dddb0','ev-red':'#f28b9a','ev-yellow':'#f5d57a','ev-purple':'#c4b0f7','ev-teal':'#a8b8e8','ev-orange':'#f5b07a','ev-lime':'#d8f07a','ev-pink':'#f7c8e0' };
const CAT_LABEL = { '':'WORK','ev-green':'PERSONAL','ev-orange':'FITNESS','ev-yellow':'TRAVEL','ev-teal':'SLEEP','ev-purple':'FINANCE','ev-red':'SOCIAL','ev-lime':'MEALS','ev-pink':'HYGIENE' };
const RECUR_LBL = { none:'', daily:'↻ DAILY', weekly:'↻ WEEKLY', monthly:'↻ MONTHLY', yearly:'↻ YEARLY' };
function recurLabel(ev) {
  if (!ev.recurrence || ev.recurrence === 'none') return '';
  if (ev.recurrence === 'weekly' && ev.weeklyDays && ev.weeklyDays.length) {
    const names = ev.weeklyDays.sort((a,b)=>a-b).map(d=>DAYS[d]);
    return '↻ WEEKLY · ' + names.join(', ');
  }
  return RECUR_LBL[ev.recurrence] || '';
}

let today      = new Date();
let cursor     = new Date(today);
let view       = 'week';
let customDays = JSON.parse(localStorage.getItem('chrono_custom_days') || '[1,2,3,4,5]');
let events     = JSON.parse(localStorage.getItem('chrono_v2_events')     || '[]');
let exceptions = JSON.parse(localStorage.getItem('chrono_v2_exceptions') || '{}');
let calendars  = JSON.parse(localStorage.getItem('chrono_v2_calendars')  || 'null') || [
  { id:'default', name:'Personal', color:'', visible:true }
];
// One-time migration: fix Veterans' Liberty 2026 from old Mon 11/9–Fri 11/13 to correct Tue 11/10–Thu 11/12
(function(){
  const ev = events.find(e=>e.calendar==='liberty' && e.title==="Veterans' Day Liberty" && e.date==='2026-11-09');
  if (ev) { ev.date='2026-11-10'; ev.endDate='2026-11-12'; localStorage.setItem('chrono_v2_events', JSON.stringify(events)); }
})();
let editingId  = null;
let editingOcc = null;
let detailId   = null;
let detailOcc  = null;
let miniCursor = new Date(today);
let selRecur      = 'none';
let selWeeklyDays = [];
let pendingAct = null;
let pendingDat = null;

// ---- HOUR ZOOM ----
let HOUR_ZOOM_MODE = localStorage.getItem('chrono_hour_zoom_mode') || '64';
let HOUR_PX = HOUR_ZOOM_MODE === 'auto' ? 64 : (parseInt(HOUR_ZOOM_MODE, 10) || 64);
function computeAutoHourPx() {
  let minDur = Infinity;
  const todayDs = todayStr();
  const ws = wkStart(cursor);
  const rangeStart = dateStr(new Date(ws.getTime() - 7 * 864e5));
  const rangeEnd = dateStr(new Date(ws.getTime() + 14 * 864e5));
  try {
    const all = expandRange(rangeStart, rangeEnd);
    all.forEach(x => {
      const ev = x.ev;
      if (ev.allDay || !ev.start || !ev.end) return;
      const a = (x.cs||ev.start).split(':'), b = (x.ce||ev.end).split(':');
      let dur = (+b[0]) * 60 + (+b[1]) - ((+a[0]) * 60 + (+a[1]));
      if (dur <= 0) dur += 1440;
      if (dur > 0 && dur < minDur) minDur = dur;
    });
  } catch (e) { /* fall through */ }
  if (!isFinite(minDur)) return 64;
  return Math.min(520, Math.max(64, Math.ceil(44 * 60 / minDur)));
}
function applyHourPx(px) {
  HOUR_PX = px;
  document.documentElement.style.setProperty('--hh', HOUR_PX + 'px');
}
function refreshZoom() {
  if (HOUR_ZOOM_MODE === 'auto') applyHourPx(computeAutoHourPx());
  else applyHourPx(parseInt(HOUR_ZOOM_MODE, 10) || 64);
}
function setHourZoom(v) {
  HOUR_ZOOM_MODE = v;
  localStorage.setItem('chrono_hour_zoom_mode', v);
  refreshZoom();
  render();
}
function applyHourZoomUI() {
  refreshZoom();
  const s = document.getElementById('hourZoom');
  if (s) s.value = HOUR_ZOOM_MODE;
  render();
}
if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', applyHourZoomUI); } else { applyHourZoomUI(); }

// ---- TIME FORMAT (12h / 24h) ----
let TIME_FMT = localStorage.getItem('chrono_time_fmt') || '12';
function fmtTime(t) {
  if (!t) return '';
  const p = t.split(':'); let h = +p[0]; const m = p[1];
  if (TIME_FMT === '24') return String(h).padStart(2,'0') + ':' + m;
  const ap = h < 12 ? 'AM' : 'PM'; let hh = h % 12; if (hh === 0) hh = 12;
  return hh + ':' + m + ap;
}
function fmtHourLbl(i) {
  if (TIME_FMT === '24') return String(i).padStart(2,'0') + ':00';
  if (i === 0) return '12AM'; if (i < 12) return i + 'AM'; if (i === 12) return '12PM'; return (i - 12) + 'PM';
}
function setTimeFmt(v) { TIME_FMT = v; localStorage.setItem('chrono_time_fmt', v); render(); }
function applyTimeFmtUI() { const s = document.getElementById('timeFmt'); if (s) s.value = TIME_FMT; }
if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', applyTimeFmtUI); } else { applyTimeFmtUI(); }

function saveAll() {
  localStorage.setItem('chrono_v2_events', JSON.stringify(events));
  localStorage.setItem('chrono_v2_exceptions', JSON.stringify(exceptions));
  localStorage.setItem('chrono_v2_calendars', JSON.stringify(calendars));
  if (typeof HOUR_ZOOM_MODE !== 'undefined' && HOUR_ZOOM_MODE === 'auto') refreshZoom();
  scheduleSyncPush();
}
function uid() { return Date.now().toString(36)+Math.random().toString(36).slice(2); }
function dateStr(d) { return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function todayStr() { return dateStr(today); }
function parseLocal(s) { return new Date(s+'T00:00:00'); }
function addDays(ds,n){ const d=parseLocal(ds); d.setDate(d.getDate()+n); return dateStr(d); }

// ---- CALENDARS ----
function visibleCalIds() { return calendars.filter(c=>c.visible).map(c=>c.id); }
function calById(id) { return calendars.find(c=>c.id===id); }
function renderCalList() {
  const box = document.getElementById('calList');
  if (!box) return;
  box.innerHTML = calendars.map(c => {
    const swatch = c.color ? (COLOR_HEX[c.color]||'#7dd8f0') : '#7dd8f0';
    const canDel = c.id !== 'default';
    return `<div class="cal-row${c.visible?'':' off'}">
      <div class="cal-swatch" style="background:${swatch}" onclick="toggleCalendar('${c.id}')"></div>
      <div class="cal-name" onclick="toggleCalendar('${c.id}')" title="${c.name}">${c.name}</div>
      ${canDel ? `<button class="cal-del" onclick="deleteCalendar('${c.id}')" title="Delete calendar">&#x2715;</button>` : ''}
    </div>`;
  }).join('');
  const sel = document.getElementById('evCalendar');
  if (sel) {
    const prev = sel.value;
    sel.innerHTML = calendars.map(c=>`<option value="${c.id}">${c.name}</option>`).join('');
    if (prev && calById(prev)) sel.value = prev;
  }
}
function toggleCalendar(id) {
  const c = calById(id); if (!c) return;
  c.visible = !c.visible; saveAll(); renderCalList(); render();
}
function promptNewCalendar() {
  const name = prompt('New calendar name:');
  if (!name || !name.trim()) return;
  const palette = ['','ev-green','ev-purple','ev-teal','ev-orange','ev-yellow','ev-red'];
  const used = calendars.map(c=>c.color);
  const color = palette.find(p=>!used.includes(p)) || palette[calendars.length % palette.length];
  calendars.push({ id: uid(), name: name.trim(), color, visible: true });
  saveAll(); renderCalList(); render();
}
function deleteCalendar(id) {
  if (id === 'default') return;
  const c = calById(id); if (!c) return;
  if (!confirm(`Delete calendar "${c.name}" and all its events?`)) return;
  events = events.filter(e => (e.calendar||'default') !== id);
  calendars = calendars.filter(c => c.id !== id);
  saveAll(); renderCalList(); render();
}

// ---- UNDO / REDO ----
let undoStack=[], redoStack=[], applyingHistory=false;
const UNDO_LIMIT=100;
function snapshotState(){return JSON.stringify({events,exceptions});}
function pushHistory(){
  undoStack.push(snapshotState());
  if(undoStack.length>UNDO_LIMIT)undoStack.shift();
  redoStack=[];
  updateUndoRedoUI();
}
function restoreState(snap){
  const s=JSON.parse(snap);
  events=s.events;exceptions=s.exceptions;
  applyingHistory=true;
  saveAll();
  applyingHistory=false;
  closeDetail();closeRecurDialog();
  render();
  updateUndoRedoUI();
}
function doUndo(){
  if(!undoStack.length)return;
  redoStack.push(snapshotState());
  restoreState(undoStack.pop());
}
function doRedo(){
  if(!redoStack.length)return;
  undoStack.push(snapshotState());
  restoreState(redoStack.pop());
}
function updateUndoRedoUI(){
  const u=document.getElementById('btnUndo'),r=document.getElementById('btnRedo');
  if(u)u.disabled=!undoStack.length;
  if(r)r.disabled=!redoStack.length;
}
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&!e.shiftKey&&(e.key==='z'||e.key==='Z')){
    const t=e.target;
    if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'))return;
    e.preventDefault();doUndo();
  } else if(((e.ctrlKey||e.metaKey)&&(e.key==='y'||e.key==='Y'))||((e.ctrlKey||e.metaKey)&&e.shiftKey&&(e.key==='z'||e.key==='Z'))){
    const t=e.target;
    if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'))return;
    e.preventDefault();doRedo();
  }
});
if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',updateUndoRedoUI);}else{updateUndoRedoUI();}

// ---- EXPAND RECURRENCES ----
function overnight(ev){
  if (ev.allDay || !ev.start || !ev.end) return false;
  const a=ev.start.split(':'), b=ev.end.split(':');
  return ((+b[0])*60+(+b[1])) <= ((+a[0])*60+(+a[1]));
}
function pushOcc(result, ev, occ, startDs, endDs){
  if (overnight(ev)) {
    if (occ >= startDs && occ <= endDs) result.push({ ev, occ, cs: ev.start, ce: '24:00' });
    const nd = dateStr(new Date(parseLocal(occ).getTime() + 864e5));
    if (nd >= startDs && nd <= endDs) result.push({ ev, occ: nd, cs: '00:00', ce: ev.end, cont: occ });
  } else {
    if (occ >= startDs && occ <= endDs) result.push({ ev, occ });
  }
}
function expandRange(startDs, endDs) {
  const result = [];
  const scanStart = dateStr(new Date(parseLocal(startDs).getTime() - 864e5));
  const vis = visibleCalIds();
  events.forEach(ev => {
    if (!vis.includes(ev.calendar||'default')) return;
    const exList = exceptions[ev.id] || [];
    if (!ev.recurrence || ev.recurrence === 'none') {
      // Multi-day (endDate) events expand into one occurrence per day.
      if (ev.endDate && ev.endDate > ev.date) {
        let cur = parseLocal(ev.date);
        const endD = parseLocal(ev.endDate);
        let safety = 0;
        while (dateStr(cur) <= dateStr(endD) && safety++ < 370) {
          const ds = dateStr(cur);
          if (ds >= scanStart && ds <= endDs && !exList.includes(ds)) {
            pushOcc(result, ev, ds, startDs, endDs);
          }
          cur.setDate(cur.getDate() + 1);
        }
      } else {
        if (ev.date >= scanStart && ev.date <= endDs && !exList.includes(ev.date))
          pushOcc(result, ev, ev.date, startDs, endDs);
      }
      return;
    }
    if (ev.recurrence === 'weekly' && ev.weeklyDays && ev.weeklyDays.length) {
      const cap = ev.recurrenceEnd || endDs;
      const rangeStart = parseLocal(scanStart);
      let cur = new Date(rangeStart);
      let safety = 0;
      while (dateStr(cur) <= endDs && dateStr(cur) <= cap && safety++ < 1000) {
        const ds = dateStr(cur);
        if (ds >= ev.date && ev.weeklyDays.includes(cur.getDay()) && !exList.includes(ds))
          pushOcc(result, ev, ds, startDs, endDs);
        cur.setDate(cur.getDate() + 1);
      }
      return;
    }
    const cap = ev.recurrenceEnd || endDs;
    let cur = parseLocal(ev.date);
    let safety = 0;
    while (dateStr(cur) <= endDs && dateStr(cur) <= cap && safety++ < 3650) {
      const ds = dateStr(cur);
      if (ds >= scanStart && !exList.includes(ds)) pushOcc(result, ev, ds, startDs, endDs);
      cur = nextOcc(cur, ev.recurrence);
    }
  });
  return result;
}
function nextOcc(d, r) {
  const n = new Date(d);
  if (r==='daily')   n.setDate(n.getDate()+1);
  else if (r==='weekly')  n.setDate(n.getDate()+7);
  else if (r==='monthly') n.setMonth(n.getMonth()+1);
  else if (r==='yearly')  n.setFullYear(n.getFullYear()+1);
  return n;
}

// ---- RENDER ----
function render() {
  updateLabel(); renderMini();
  if (view==='month') renderMonth();
  else if (view==='week') renderWeek();
  else if (view==='custom') renderCustom();
  else if (view==='stats') renderStats();
  else renderDay();
  document.querySelectorAll('.view-btn').forEach(b=>b.classList.remove('active'));
  const activeBtn = document.getElementById('btn-'+view);
  if (activeBtn) activeBtn.classList.add('active');
}
function updateLabel() {
  const lbl = document.getElementById('currentLabel');
  if (view==='month') { lbl.textContent = MONTHS[cursor.getMonth()].toUpperCase()+' '+cursor.getFullYear(); return; }
  if (view==='week') {
    const ws = wkStart(cursor), we = new Date(ws); we.setDate(we.getDate()+6);
    lbl.textContent = ws.getMonth()===we.getMonth()
      ? MONTHS[ws.getMonth()].slice(0,3).toUpperCase()+' '+ws.getFullYear()
      : MONTHS[ws.getMonth()].slice(0,3).toUpperCase()+' — '+MONTHS[we.getMonth()].slice(0,3).toUpperCase()+' '+we.getFullYear();
    return;
  }
  lbl.textContent = DAYS[cursor.getDay()]+' '+String(cursor.getDate()).padStart(2,'0')+' '+MONTHS[cursor.getMonth()].slice(0,3).toUpperCase()+' '+cursor.getFullYear();
}

function renderMonth() {
  const mv = document.getElementById('mainView');
  const yr = cursor.getFullYear(), mo = cursor.getMonth();
  const off = (new Date(yr, mo, 1).getDay()+6)%7;
  const sd = dateStr(new Date(yr,mo,1-off)), ed = dateStr(new Date(yr,mo,42-off));
  const all = expandRange(sd, ed);
  let h = '<div class="month-view"><div class="month-dow-header">'+WDAYS.map(d=>`<div>${d}</div>`).join('')+'</div><div class="month-grid">';
  for (let i=0;i<42;i++) {
    const cd = new Date(yr,mo,1-off+i), ds = dateStr(cd);
    const isT = ds===todayStr(), isO = cd.getMonth()!==mo;
    h += `<div class="month-cell${isO?' other-month':''}${isT?' today':''}" onclick="cellClick('${ds}',event)">`;
    h += `<div class="day-num"><span>${cd.getDate()}</span></div>`;
    all.filter(x=>x.occ===ds).slice(0,4).forEach(({ev,occ})=>{
      const rm = ev.recurrence&&ev.recurrence!=='none'?'↻ ':'';
      h += `<div class="month-event ${ev.color||''}" onclick="showDetail(event,'${ev.id}','${occ}')">${rm}${ev.allDay?'':fmtTime(ev.start)+'–'+fmtTime(ev.end)+' '}${ev.title}</div>`;
    });
    h += '</div>';
  }
  mv.innerHTML = h+'</div></div>';
}

function wkStart(d) { const s=new Date(d); s.setDate(s.getDate()-((s.getDay()+6)%7)); s.setHours(0,0,0,0); return s; }

// Build one all-day strip where multi-day events render as a single continuous bar
// spanning their day columns (Google Calendar style). allDayEvs = expanded occurrences
// for the visible range; cols = array of Date for the visible columns.
function buildSpanStrip(allDayEvs, cols) {
  const N = cols.length;
  const colStart = cols.map(d=>dateStr(d));
  // Group occurrences by event id, preserving span across columns
  const groups = new Map(); // id -> {ev, firstIdx, lastIdx, firstOcc}
  allDayEvs.forEach(({ev,occ})=>{
    const idx = colStart.indexOf(occ);
    if (idx<0) return;
    if (!groups.has(ev.id)) groups.set(ev.id, {ev, firstIdx: idx, lastIdx: idx, firstOcc: occ});
    else { const g=groups.get(ev.id); if(idx<g.firstIdx)g.firstIdx=idx; if(idx>g.lastIdx)g.lastIdx=idx; }
  });
  // Sort segments: longer spans first, then earlier start (Google-style stacking)
  const segs = [...groups.values()].sort((a,b)=> (b.lastIdx-b.firstIdx)-(a.lastIdx-a.firstIdx) || a.firstIdx-b.firstIdx);
  // Lane assignment: first-fit into rows
  const laneEnds = []; // per lane, last occupied column index
  segs.forEach(g=>{
    let lane = laneEnds.findIndex(end=>g.firstIdx>end);
    if (lane<0) { lane = laneEnds.length; laneEnds.push(-1); }
    g.lane = lane; laneEnds[lane] = g.lastIdx;
  });
  const lanes = laneEnds.length || 1;
  const trackH = Math.max(20, lanes*20+3);
  const colW = 100/N;
  let h = `<div class="allday-row"><div class="allday-label">ALL DAY</div><div class="allday-track" style="height:${trackH}px" onclick="alldayStripClick(event,'${colStart[0]}',${N})">`;
  segs.forEach(g=>{
    const rm = g.ev.recurrence&&g.ev.recurrence!=='none'?'↻ ':'';
    const isStart = g.firstIdx===0 || !g.ev.endDate || (g.ev.date >= colStart[0]);
    const isEnd = g.lastIdx===N-1 ? (!g.ev.endDate || g.ev.endDate<=colStart[N-1]) : true;
    const startsInRange = !g.ev.endDate || g.ev.date >= colStart[0];
    const endsInRange = !g.ev.endDate || g.ev.endDate <= colStart[N-1];
    const cls = (startsInRange?'span-start ':'')+(endsInRange?'span-end ':'');
    const left = (g.firstIdx*colW).toFixed(4), width = ((g.lastIdx-g.firstIdx+1)*colW).toFixed(4);
    h += `<div class="allday-span ${cls}${g.ev.color||''}" style="left:calc(${left}% + 1px);width:calc(${width}% - 3px);top:${g.lane*20+2}px" onclick="showDetail(event,'${g.ev.id}','${g.firstOcc}')">${rm}${g.ev.title}</div>`;
  });
  h += '</div></div>';
  return h;
}

function renderWeek() {
  const mv = document.getElementById('mainView');
  const ws = wkStart(cursor);
  const cols = Array.from({length:7},(_,i)=>{const d=new Date(ws);d.setDate(d.getDate()+i);return d;});
  const all = expandRange(dateStr(cols[0]), dateStr(cols[6]));
  let h = '<div class="week-view"><div class="week-header-row"><div></div>';
  cols.forEach(d=>{
    const isT = dateStr(d)===todayStr();
    h += `<div class="week-header-cell${isT?' today':''}"><div class="dow">${DAYS[d.getDay()]}</div><div class="wdate" onclick="goDay('${dateStr(d)}')">${d.getDate()}</div></div>`;
  });
  h += '</div>'; // close week-header-row
  // ALL-DAY STRIP — Google Calendar style: each event renders as ONE bar spanning its days
  const allDayEvs = all.filter(x=>x.ev.allDay);
  h += buildSpanStrip(allDayEvs, cols);
  h += '<div class="week-time-grid"><div class="time-labels">';
  for(let i=0;i<24;i++) h += `<div class="time-label">${i===0?'':fmtHourLbl(i)}</div>`;
  h += '</div>';
  cols.forEach(d=>{
    const ds=dateStr(d), isT=ds===todayStr();
    h += `<div class="week-day-col" onclick="colClick('${ds}',event)">`;
    for(let i=0;i<24;i++) h += `<div class="hour-line"></div>`;
    const dayEvs=all.filter(x=>x.occ===ds&&!x.ev.allDay);
    const lay=layoutOverlap(dayEvs);
    dayEvs.forEach(({ev,occ,cs,ce,cont})=>{
      const csT=cs||ev.start, ceT=ce||ev.end;
      const [sh,sm]=csT.split(':').map(Number),[eh,em]=ceT.split(':').map(Number);
      const top=(sh*60+sm)/60*HOUR_PX;
      const ht=Math.max(((eh*60+em)-(sh*60+sm))/60*HOUR_PX,8);
      const rm=ev.recurrence&&ev.recurrence!=='none'?'↻ ':'';
      const L=lay[ev.id+'|'+occ]||{left:0,width:100};
      h += `<div class="week-event ${ev.color||''}" data-drag-id="${ev.id}" data-drag-occ="${occ}" style="top:${top}px;height:${ht}px;left:calc(${L.left}% + 1px);width:calc(${L.width}% - 2px);right:auto" onclick="showDetail(event,'${ev.id}','${occ}')"><div class="ev-time">${fmtTime(csT)}–${fmtTime(ceT)}</div><div class="ev-name">${rm}${ev.title}</div></div>`;
    });
    if(isT){const n=new Date(),p=(n.getHours()*60+n.getMinutes())/60*HOUR_PX;h+=`<div class="now-line" style="top:${p}px"></div>`;}
    h += '</div>';
  });
  restoreGridScroll(mv, h+'</div></div>');
}

// Keep the user's scroll position across re-renders (e.g. after delete/edit).
// On the very first paint of a view, center on 07:00 like before.
let lastGridScroll = null;
function restoreGridScroll(mv, html){
  const gridSel = '.week-time-grid, .day-time-grid';
  const old = mv.querySelector(gridSel);
  if (old && old.scrollTop > 0) lastGridScroll = old.scrollTop;
  mv.innerHTML = html;
  setTimeout(()=>{
    const tg = mv.querySelector(gridSel);
    if (tg) tg.scrollTop = (lastGridScroll !== null ? lastGridScroll : 7*HOUR_PX);
  },0);
}

function layoutOverlap(items){
  const evs=items.map(({ev,occ,cs,ce})=>{
    const [sh,sm]=(cs||ev.start).split(':').map(Number),[eh,em]=(ce||ev.end).split(':').map(Number);
    return {ev,occ,s:sh*60+sm,e:eh*60+em};
  }).sort((a,b)=>a.s-b.s||b.e-a.e);
  const res={},active=[],clusters=[];
  let cluster=null,clusterEnd=-1;
  for(const it of evs){
    if(!cluster||it.s>=clusterEnd){ if(cluster)clusters.push(cluster); cluster=[it]; clusterEnd=it.e; }
    else{ cluster.push(it); clusterEnd=Math.max(clusterEnd,it.e); }
  }
  if(cluster)clusters.push(cluster);
  for(const cl of clusters){
    const lanes=[];
    for(const it of cl){
      let placed=false;
      for(let i=0;i<lanes.length;i++){
        if(it.s>=lanes[i]){lanes[i]=it.e;res[it.ev.id+'|'+it.occ]={lane:i};placed=true;break;}
      }
      if(!placed){res[it.ev.id+'|'+it.occ]={lane:lanes.length};lanes.push(it.e);}
    }
    const n=lanes.length;
    for(const it of cl){
      const k=it.ev.id+'|'+it.occ, l=res[k].lane;
      res[k].left=(l/n*100); res[k].width=(100/n);
    }
  }
  return res;
}

function renderDay() {
  const mv = document.getElementById('mainView');
  const ds = dateStr(cursor), isT = ds===todayStr();
  const all = expandRange(ds,ds);
  let h = `<div class="day-view"><div class="day-header${isT?' today':''}"><div class="dow">${DAYS[cursor.getDay()]}</div><div class="ddate">${String(cursor.getDate()).padStart(2,'0')}</div></div>`;
  const dayAllDay = all.filter(x=>x.ev.allDay);
  h += buildSpanStrip(dayAllDay, [new Date(cursor)]);
  h += '<div class="day-time-grid"><div class="time-labels">';
  for(let i=0;i<24;i++) h += `<div class="time-label">${i===0?'':fmtHourLbl(i)}</div>`;
  h += `</div><div class="day-col" onclick="colClick('${ds}',event)">`;
  for(let i=0;i<24;i++) h += `<div class="hour-line"></div>`;
  const dayOnlyEvs=all.filter(x=>!x.ev.allDay);
  const dayLay=layoutOverlap(dayOnlyEvs);
  dayOnlyEvs.forEach(({ev,occ,cs,ce,cont})=>{
    const csT=cs||ev.start, ceT=ce||ev.end;
    const [sh,sm]=csT.split(':').map(Number),[eh,em]=ceT.split(':').map(Number);
    const top=(sh*60+sm)/60*HOUR_PX, ht=Math.max(((eh*60+em)-(sh*60+sm))/60*HOUR_PX,8);
    const rm=ev.recurrence&&ev.recurrence!=='none'?'↻ ':'';
    const L=dayLay[ev.id+'|'+occ]||{left:0,width:100};
    h += `<div class="day-event ${ev.color||''}" data-drag-id="${ev.id}" data-drag-occ="${occ}" style="top:${top}px;height:${ht}px;left:calc(${L.left}% + 2px);width:calc(${L.width}% - 4px);right:auto" onclick="showDetail(event,'${ev.id}','${occ}')"><strong>${fmtTime(csT)}–${fmtTime(ceT)}</strong><br>${rm}${ev.title}</div>`;
  });
  if(isT){const n=new Date(),p=(n.getHours()*60+n.getMinutes())/60*HOUR_PX;h+=`<div class="now-line" style="top:${p}px"></div>`;}
  restoreGridScroll(mv, h+'</div></div></div>');
}

function renderMini() {
  const y=miniCursor.getFullYear(),m=miniCursor.getMonth();
  const off=(new Date(y,m,1).getDay()+6)%7;
  let h=`<div class="mini-header"><button class="mini-nav" onclick="miniPrev()">&#8249;</button><span class="mini-month">${MONTHS[m].slice(0,3).toUpperCase()} ${y}</span><button class="mini-nav" onclick="miniNext()">&#8250;</button></div>`;
  h += `<table class="mini-grid"><thead><tr>${WDAYS.map(d=>`<th>${d[0]}</th>`).join('')}</tr></thead><tbody>`;
  let day=1-off;
  for(let r=0;r<6;r++){
    h+='<tr>';
    for(let c=0;c<7;c++){
      const cd=new Date(y,m,day),ds=dateStr(cd);
      const isT=ds===todayStr(),isSel=ds===dateStr(cursor),isO=cd.getMonth()!==m;

  const scope=document.querySelector('input[name=recurScope]:checked').value;
  document.getElementById('recurDialog').classList.remove('open');
  pushHistory();
  if(pendingAct==='delete'){
    if(scope==='all'){events=events.filter(e=>e.id!==editingId);delete exceptions[editingId];}
    else{if(!exceptions[editingId])exceptions[editingId]=[];exceptions[editingId].push(editingOcc);}
  } else if(pendingAct==='save'){
    if(scope==='all'){const i=events.findIndex(e=>e.id===editingId);if(i>=0)events[i]={id:editingId,...pendingDat};}
    else{if(!exceptions[editingId])exceptions[editingId]=[];exceptions[editingId].push(editingOcc);events.push({id:uid(),...pendingDat,recurrence:'none',recurrenceEnd:''});}
  } else if(pendingAct==='move'){
    const ev=events.find(e=>e.id===editingId); if(!ev){saveAll();render();pendingAct=null;pendingDat=null;return;}
    if(scope==='all'){
      ev.start=pendingDat.start; ev.end=pendingDat.end;
    } else {
      if(!exceptions[editingId])exceptions[editingId]=[];exceptions[editingId].push(editingOcc);
      events.push({...ev,id:uid(),date:editingOcc,start:pendingDat.start,end:pendingDat.end,recurrence:'none',recurrenceEnd:'',weeklyDays:[]});
    }
  }
  saveAll();render();pendingAct=null;pendingDat=null;
}

// ---- DRAG-TO-MOVE (5-minute snap) ----
// Grab a timed event block and drag it up/down; snaps to 5-minute steps and
// shows the new time range live. On release it updates the event; recurring
// events prompt "this occurrence vs whole series" via the shared recurDialog.
let dragSt=null;
const SNAP_MIN=5;
const DRAG_HOLD_MS=550; // touch: hold this long before a block becomes draggable
function t2m(t){const[a,b]=t.split(':').map(Number);return a*60+b;}
function m2t(m){const h=String(Math.floor(m/60)).padStart(2,'0'),mm=String(m%60).padStart(2,'0');return h+':'+mm;}
document.addEventListener('pointerdown',e=>{
  const el=e.target.closest('[data-drag-id]');
  if(!el) return;
  const ev=events.find(x=>x.id===el.dataset.dragId);
  if(!ev||ev.allDay) return;
  const col=el.closest('.week-day-col,.day-col'); if(!col) return;
  // Overnight events (end <= start, e.g. Sleep 21:30-05:30) are rendered as
  // TWO blocks: the evening block on the event's own day (occ === ev's date)
  // and the morning block on the next day (occ = next day). Work in absolute
  // minutes where the end can exceed 1440 so the duration is never negative.
  const startM=t2m(ev.start);
  let endM=t2m(ev.end);
  const isOvernight = endM<=startM;
  if(isOvernight) endM+=1440; // unwrap across midnight -> real duration
  const dur=endM-startM;
  // Which segment did we grab? If this block's occurrence date is AFTER the
  // event's anchor date, it's the morning continuation block (00:00 -> end).
  // Otherwise it's the main evening block (start -> 24:00).
  const anchorDs = ev.date;
  const occDs = el.dataset.dragOcc;
  const isMorningSeg = isOvernight && occDs>anchorDs;
  // The on-screen start minute of THIS block:
  const segStartM = isMorningSeg ? 0 : startM;
  // LONG-PRESS GATE (touch only): a quick tap still opens the detail popup.
  // The drag only arms after the finger has held still for DRAG_HOLD_MS;
  // a small hold indicator shows on the block while it charges.
  dragSt={
    ev, el, occ:occDs,
    colRect: col.getBoundingClientRect(),
    grabMin: Math.round((e.clientY-col.getBoundingClientRect().top)/HOUR_PX*60/SNAP_MIN)*SNAP_MIN,
    startM, endM, dur, isOvernight, isMorningSeg, segStartM,
    moved:false,
    isTouch: e.pointerType==='touch',
    armed: e.pointerType!=='touch', // mouse/pen arm instantly, touch must hold
    startX: e.clientX, startY: e.clientY,
    holdT: null
  };
  if(dragSt.isTouch){
    el.classList.add('lp-hold');
    dragSt.holdT=setTimeout(()=>{ if(dragSt){ dragSt.armed=true; el.classList.remove('lp-hold'); el.classList.add('lp-armed'); } }, DRAG_HOLD_MS);
  }
});
document.addEventListener('pointermove',e=>{
  if(!dragSt) return;
  if(!dragSt.armed){
    // Touch still in the hold window: if the finger moved off the block, it's a
    // scroll — cancel the pending drag so the page can scroll normally.
    if(Math.abs(e.clientY-dragSt.startY)>10 || Math.abs(e.clientX-dragSt.startX)>10){
      clearTimeout(dragSt.holdT); dragSt.el.classList.remove('lp-hold'); dragSt=null;
    }
    return;
  }
  const y=e.clientY-dragSt.colRect.top;
  let under=Math.round(y/HOUR_PX*60/SNAP_MIN)*SNAP_MIN; // snapped minute under cursor
  // Move THIS block; its on-screen length is what clamps the drag.
  const segLen = dragSt.isMorningSeg ? (dragSt.endM-1440) : (dragSt.isOvernight ? (1440-dragSt.startM) : dragSt.dur);
  let newSegStart=Math.max(0,Math.min(24*60-segLen, under-(dragSt.grabMin-dragSt.segStartM)));
  if(newSegStart===dragSt.segStartM && !dragSt.moved) return;
  if(!dragSt.moved){
    // First real move: spawn the ghost clone and hide the original block.
    // From here on ONLY the ghost moves — the rendered grid is never touched,
    // which kills the screen flash the live style.top mutation was causing.
    dragSt.moved=true;
    const g=dragSt.el.cloneNode(true);
    g.classList.add('drag-ghost');
    g.removeAttribute('data-drag-id'); g.removeAttribute('onclick');
    g.style.left=dragSt.el.offsetLeft+'px';
    g.style.width=dragSt.el.offsetWidth+'px';
    g.style.top=dragSt.el.offsetTop+'px';
    g.style.height=dragSt.el.offsetHeight+'px';
    dragSt.el.parentElement.appendChild(g);
    dragSt.ghost=g;
    dragSt.el.classList.add('drag-origin-hidden');
  }
  dragSt.newSegStart=newSegStart;
  // Convert the block's new on-screen start back to the event's absolute start.
  let newAbsStart;
  if(dragSt.isMorningSeg){
    newAbsStart = dragSt.startM + (newSegStart - dragSt.segStartM);
  } else {
    newAbsStart = newSegStart;
  }
  dragSt.newStart = newAbsStart;
  dragSt.ghost.style.top=(newSegStart/60*HOUR_PX)+'px';
  const tl=dragSt.ghost.querySelector('.ev-time')||dragSt.ghost.querySelector('strong');
  if(tl) tl.textContent=fmtTime(m2t(newSegStart))+'–'+fmtTime(m2t(newSegStart+segLen));
});
let suppressNextClick=false;
document.addEventListener('pointerup',()=>{
  if(!dragSt) return;
  const st=dragSt; dragSt=null;
  clearTimeout(st.holdT);
  st.el.classList.remove('lp-hold','lp-armed');
  if(!st.moved) return; // was a plain click — let onclick handle detail popup
  // Clean up ghost + restore original before committing.
  if(st.ghost) st.ghost.remove();
  st.el.classList.remove('drag-origin-hidden');
  suppressNextClick=true;
  setTimeout(()=>{suppressNextClick=false;},50);
  applyDragMove(st);
});
// Safety net: if the pointer is cancelled mid-drag (window blur, touch cancel),
// never leave a ghost or a hidden block stranded.
document.addEventListener('pointercancel',()=>{
  if(!dragSt) return;
  clearTimeout(dragSt.holdT);
  dragSt.el.classList.remove('lp-hold','lp-armed');
  if(dragSt.ghost) dragSt.ghost.remove();
  dragSt.el.classList.remove('drag-origin-hidden');
  dragSt=null;
});
// Swallow the click that follows a real drag so the detail popup doesn't open
document.addEventListener('click',e=>{
  if(suppressNextClick && e.target.closest('[data-drag-id]')){ e.stopPropagation(); e.preventDefault(); }
},true);
function applyDragMove(st){
  // st.newStart is the event's absolute start minute; wrap end across midnight
  // with modulo so overnight events (Sleep) shift cleanly on both days.
  const sMin=((st.newStart%1440)+1440)%1440;
  const eMin=((sMin+st.dur)%1440);
  const ns=m2t(sMin), ne=m2t(eMin);
  const ev=st.ev;
  const commit=(target)=>{ target.start=ns; target.end=ne; };
  if(!ev.recurrence||ev.recurrence==='none'){
    pushHistory(); commit(ev); saveAll(); render(); return;
  }
  // Recurring: route through the shared scope dialog as a 'move' action
  pendingAct='move'; pendingDat={start:ns,end:ne};
  editingId=ev.id; editingOcc=st.occ;
  document.querySelector('input[name=recurScope][value="this"]').checked=true;
  document.getElementById('recurDialog').classList.add('open');
}

// ---- DETAIL ----
function showDetail(e,id,occ){
  e.stopPropagation();
  const ev=events.find(x=>x.id===id);if(!ev)return;

  const cols = sorted.map(d => {

  });

  for(let i=0;i<24;i++) h += `<div class="time-label">${i===0?'':fmtHourLbl(i)}</div>`;
  h += '</div>';
  cols.forEach(d => {
    const ds=dateStr(d), isT=ds===todayStr();

    for(let i=0;i<24;i++) h += `<div class="hour-line"></div>`;

    const lay=layoutOverlap(dayEvs);
    dayEvs.forEach(({ev,occ,cs,ce,cont})=>{
      const csT=cs||ev.start, ceT=ce||ev.end;
      const [sh,sm]=csT.split(':').map(Number),[eh,em]=ceT.split(':').map(Number);
