function renderStats() {
  const mv = document.getElementById('mainView');
  const ws = wkStart(cursor);
  const sd = dateStr(ws), ed = dateStr(new Date(ws.getTime() + 6*864e5));
  const all = expandRange(sd, ed);

  const catMin = {};
  const bucketMin = { work:0, sleep:0, personal:0 };
  const BUCKET = { '':'work','ev-yellow':'work','ev-teal':'sleep',
    'ev-green':'personal','ev-orange':'personal','ev-lime':'personal',
    'ev-pink':'personal','ev-red':'personal','ev-purple':'personal' };
  let totalMin = 0;
  all.forEach(({ev, cs, ce}) => {
    if (ev.allDay || !ev.start || !ev.end) return;
    const a = (cs||ev.start).split(':'), b = (ce||ev.end).split(':');
    let dur = (+b[0])*60 + (+b[1]) - ((+a[0])*60 + (+a[1]));
    if (dur <= 0) dur += 1440;
    const c = ev.color || '';
    catMin[c] = (catMin[c]||0) + dur;
    bucketMin[BUCKET[c]||'personal'] += dur;
    totalMin += dur;
  });

  const cats = Object.keys(catMin).sort((a,b)=>catMin[b]-catMin[a]);
  const hrs = m => (m/60).toFixed(1);

  let h = '<div style="display:flex;flex-wrap:wrap;gap:28px;padding:24px;overflow-y:auto;height:100%;box-sizing:border-box;align-content:flex-start">';
  h += '<div style="flex:0 0 auto"><div style="font-family:var(--mono);font-size:11px;color:var(--accent);letter-spacing:1px;margin-bottom:10px">// TIME BY CATEGORY — THIS WEEK</div>';
  h += '<canvas id="catPie" width="260" height="260" style="display:block"></canvas></div>';

  h += '<div style="flex:1 1 260px;min-width:250px"><div style="font-family:var(--mono);font-size:11px;color:var(--accent);letter-spacing:1px;margin-bottom:10px">// HOURS BY CATEGORY</div>';
  h += '<table style="width:100%;border-collapse:collapse;font-family:var(--mono);font-size:11px">';
  cats.forEach(c => {
    const hex = COLOR_HEX[c]||'#7dd8f0', lbl = CAT_LABEL[c]||'WORK';
    const pct = totalMin ? Math.round(catMin[c]/totalMin*100) : 0;
    h += '<tr style="border-bottom:1px solid var(--border)"><td style="padding:6px 8px"><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:'+hex+';margin-right:8px"></span>'+lbl+'</td><td style="padding:6px 8px;text-align:right;color:var(--text2)">'+hrs(catMin[c])+'h</td><td style="padding:6px 8px;text-align:right;color:var(--text3);width:52px">'+pct+'%</td></tr>';
  });
  h += '</table></div>';

  const target = 8 * 7;
  const bks = [['work','WORK','#7dd8f0'],['sleep','SLEEP','#a8b8e8'],['personal','PERSONAL / FREE','#7dddb0']];
  const bucketCats = { work:[], sleep:[], personal:[] };
  Object.keys(CAT_LABEL).forEach(c => { bucketCats[BUCKET[c]||'personal'].push(c); });
  h += '<div style="flex:1 1 100%;margin-top:8px"><div style="font-family:var(--mono);font-size:11px;color:var(--accent);letter-spacing:1px;margin-bottom:4px">// 8 / 8 / 8 RULE — 8H WORK · 8H SLEEP · 8H PERSONAL (PER DAY)</div>';
  h += '<div style="font-family:var(--mono);font-size:10px;color:var(--text3);margin-bottom:12px">TARGET: 56H PER WEEK EACH</div>';
  h += '<table style="width:100%;max-width:560px;border-collapse:collapse;font-family:var(--mono);font-size:11px">';
  bks.forEach(([k,lbl,hex]) => {
    const m = bucketMin[k], hh = m/60, diff = hh - target;
    const sign = diff >= 0 ? '+' : '';
    const col = diff >= 0 ? '#7dddb0' : '#f28b9a';
    const pctW = Math.min(100, Math.round(hh/(target*1.5)*100));
    const catList = bucketCats[k].map(c => CAT_LABEL[c]||c).join(' • ');
    h += '<tr style="border-bottom:1px solid var(--border)"><td style="padding:8px"><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:'+hex+';margin-right:8px"></span>'+lbl+'<div style="font-size:9px;color:var(--text3);margin-top:3px;letter-spacing:1px">'+catList+'</div></td>'
       + '<td style="padding:8px;text-align:right;color:var(--text2);width:80px">'+hh.toFixed(1)+'h / 56h</td>'
       + '<td style="padding:8px;text-align:right;width:80px;color:'+col+';font-weight:700">'+sign+diff.toFixed(1)+'h</td></tr>'
       + '<tr><td colspan="3" style="padding:0 8px 10px"><div style="height:6px;background:var(--surface);border-radius:3px;overflow:hidden"><div style="height:100%;width:'+pctW+'%;background:'+hex+'"></div></div></td></tr>';
  });
  h += '</table></div></div>';
  mv.innerHTML = h;

  const cv = document.getElementById('catPie');
  if (cv && cv.getContext) {
    const ctx = cv.getContext('2d');
    const cx = 130, cy = 130, r = 118;
    let ang = -Math.PI/2;
    if (totalMin > 0) {
      cats.forEach(c => {
        const frac = catMin[c]/totalMin;
        const a2 = ang + frac*Math.PI*2;
        ctx.beginPath(); ctx.moveTo(cx,cy);
        ctx.arc(cx,cy,r,ang,a2); ctx.closePath();
        ctx.fillStyle = COLOR_HEX[c]||'#7dd8f0'; ctx.fill();
        ang = a2;
      });
    } else {
      ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2);
      ctx.fillStyle = '#1c2128'; ctx.fill();
    }
    ctx.beginPath(); ctx.arc(cx,cy,54,0,Math.PI*2);
    ctx.fillStyle = '#0d1117'; ctx.fill();
    ctx.fillStyle = '#8b949e'; ctx.font = '11px JetBrains Mono, monospace';
    ctx.textAlign = 'center';
    ctx.fillText((totalMin/60).toFixed(1)+'h', cx, cy-2);
    ctx.fillText('SCHEDULED', cx, cy+12);
  }
}

function exportData(){

  const a = document.createElement('a');

function importDataFile(input){
  const f = input.files && input.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const data = JSON.parse(r.result);
      if (!data || !Array.isArray(data.events)) { alert('Not a CHRONO export file.'); return; }
      const have = new Set(events.map(e=>e.id));
      let added=0;
      (data.calendars||[]).forEach(c=>{ if (!calById(c.id)) calendars.push(c); });
      data.events.forEach(e=>{ if (!have.has(e.id)) { events.push(e); added++; } });
      if (data.exceptions && typeof data.exceptions==='object') {
        Object.keys(data.exceptions).forEach(k=>{
          exceptions[k] = Array.from(new Set([...(exceptions[k]||[]), ...data.exceptions[k]]));
        });
      }
      saveAll(); renderCalList(); render();
      alert(added+' event(s) imported.');
    } catch(e) { alert('Import failed: '+e.message); }
    input.value='';
  };
  r.readAsText(f);
}

// One-time: clear work-related occurrences during the Veterans' 72 (Nov 10-12, 2026).
// Adds date exceptions to recurring events whose titles match the work block patterns,
// so those blocks simply don't appear on those three days; the series resumes after.
(function clearWorkDuring72(){
  if (localStorage.getItem('chrono_v2_cleared72') === 'done') return;
  const days72 = ['2026-11-10','2026-11-11','2026-11-12'];
  const workRe = /platoon\s*pt|changeover\s+for\s+(work|pt)|^work$|lunch\s+chow/i;
  let touched = false;
  events.forEach(ev => {
    if (!ev.recurrence || ev.recurrence === 'none') return;
    if (!workRe.test((ev.title||'').trim())) return;
    if (!exceptions[ev.id]) exceptions[ev.id] = [];
    days72.forEach(ds => {
      if (!exceptions[ev.id].includes(ds)) { exceptions[ev.id].push(ds); touched = true; }
    });
  });
  // Also remove one-off (non-recurring) work events that fall on those days.
  const before = events.length;
  events = events.filter(ev => {
    if (ev.recurrence && ev.recurrence !== 'none') return true;
    if (!workRe.test((ev.title||'').trim())) return true;
    return !(ev.date >= '2026-11-10' && ev.date <= '2026-11-12');
  });
  if (touched || events.length !== before) saveAll();
  localStorage.setItem('chrono_v2_cleared72', 'done');
})();

// ================= GITHUB SYNC =================
// Same architecture as ATLAS finance sync: private repo tempo-calendar-sync,
// file sync_data.json, debounced push, poll every 30s, localStorage as offline cache.
const SYNC_OWNER = 'YourAverageGamer4407';
const SYNC_REPO  = 'tempo-calendar-sync';
const SYNC_FILE  = 'sync_data.json';
const SYNC_API   = 'https://api.github.com';
let syncSha = null, syncPushTimer = null, syncPollTimer = null, syncApplying = false;

function syncTokenGet(){ return localStorage.getItem('chrono_gh_token') || ''; }
function syncTokenSet(t){ localStorage.setItem('chrono_gh_token', t); }
function syncHdr(){ return { 'Authorization':'Bearer '+syncTokenGet(), 'Accept':'application/vnd.github+json' }; }
function syncStatusSet(msg, ok){
  const el = document.getElementById('syncStatus');
  if (el){ el.textContent = msg; el.style.color = ok === false ? 'var(--danger)' : 'var(--text2)'; }
  const dot = document.getElementById('syncDot');
  if (dot){ const on = !!syncTokenGet(); dot.textContent = on ? 'ON' : 'OFF'; dot.style.color = on ? 'var(--ok)' : 'var(--text3)'; }
}
function syncPayload(){
  return { updated: new Date().toISOString(),
    events: JSON.parse(localStorage.getItem('chrono_v2_events') || '[]'),
    exceptions: JSON.parse(localStorage.getItem('chrono_v2_exceptions') || '{}'),
    calendars: JSON.parse(localStorage.getItem('chrono_v2_calendars') || 'null') };
}
async function syncPull(){
  if (!syncTokenGet()) return false;
  const r = await fetch(`${SYNC_API}/repos/${SYNC_OWNER}/${SYNC_REPO}/contents/${SYNC_FILE}`, { headers: syncHdr() });
  if (r.status === 404) { syncSha = null; return 'empty'; }
  if (!r.ok) throw new Error('pull '+r.status);
  const j = await r.json();
  syncSha = j.sha;
  const data = JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\n/g,'')))));
  // Never wipe real local data with an empty remote.
  const localCount = JSON.parse(localStorage.getItem('chrono_v2_events')||'[]').length;
  if ((!data.events || data.events.length === 0) && localCount > 0) { syncStatusSet('REMOTE EMPTY — kept local'); return 'empty'; }
  if (Array.isArray(data.events)) {
    syncApplying = true;
    try {
      localStorage.setItem('chrono_v2_events', JSON.stringify(data.events));
      localStorage.setItem('chrono_v2_exceptions', JSON.stringify(data.exceptions||{}));
      if (data.calendars) localStorage.setItem('chrono_v2_calendars', JSON.stringify(data.calendars));
      events     = data.events;
      exceptions = data.exceptions || {};
      if (data.calendars) calendars = data.calendars;
      renderCalList(); render();
    } finally { syncApplying = false; }
  }
  syncStatusSet('SYNCED ' + new Date().toLocaleTimeString());
  return true;
}
async function syncPush(){
  if (!syncTokenGet()) return;
  const payload = syncPayload();
  const body = { message: 'chrono sync ' + payload.updated,
    content: btoa(unescape(encodeURIComponent(JSON.stringify(payload)))) };
  if (syncSha) body.sha = syncSha;
  let r = await fetch(`${SYNC_API}/repos/${SYNC_OWNER}/${SYNC_REPO}/contents/${SYNC_FILE}`,
    { method:'PUT', headers: syncHdr(), body: JSON.stringify(body) });
  if (r.status === 409 || r.status === 422) { await syncPull(); body.sha = syncSha; if (!syncSha) delete body.sha;
    r = await fetch(`${SYNC_API}/repos/${SYNC_OWNER}/${SYNC_REPO}/contents/${SYNC_FILE}`,
      { method:'PUT', headers: syncHdr(), body: JSON.stringify(body) }); }
  if (!r.ok) throw new Error('push '+r.status);
  const j = await r.json();
  syncSha = j.content.sha;
  syncStatusSet('SYNCED ' + new Date().toLocaleTimeString());
}
function scheduleSyncPush(){
  if (syncApplying || !syncTokenGet()) return;
  clearTimeout(syncPushTimer);
  syncPushTimer = setTimeout(()=>{ syncPush().catch(e=>syncStatusSet('PUSH FAIL '+e.message,false)); }, 800);
}
async function syncNow(){
  try { await syncPush(); await syncPull(); } catch(e){ syncStatusSet('SYNC FAIL '+e.message, false); }
}
async function syncConnect(){
  const inp = document.getElementById('syncToken');
  const tok = (inp && inp.value.trim()) || syncTokenGet();
  if (!tok) { syncStatusSet('PASTE TOKEN FIRST', false); return; }
  syncTokenSet(tok);
  syncStatusSet('CONNECTING...');
  try {
    // Ensure private sync repo exists.
    const chk = await fetch(`${SYNC_API}/repos/${SYNC_OWNER}/${SYNC_REPO}`, { headers: syncHdr() });
    if (chk.status === 404) {
      const cr = await fetch(`${SYNC_API}/user/repos`, { method:'POST', headers: syncHdr(),
        body: JSON.stringify({ name: SYNC_REPO, private: true, auto_init: true }) });
      if (!cr.ok) throw new Error('repo create '+cr.status);
    } else if (!chk.ok) throw new Error('repo check '+chk.status);
    const pulled = await syncPull();
    if (pulled === 'empty') await syncPush(); // first device seeds the remote
    document.getElementById('syncNowBtn').style.display = 'block';
    if (inp) inp.value = '';
    clearInterval(syncPollTimer);
    syncPollTimer = setInterval(()=>{ if(!document.hidden) syncPull().catch(e=>syncStatusSet('POLL FAIL '+e.message,false)); }, 30000);
    syncStatusSet('SYNCED ' + new Date().toLocaleTimeString());
  } catch(e){ syncStatusSet('FAIL '+e.message, false); }
}
// Pull the moment the user returns to the tab/app instead of waiting up to 30s.
document.addEventListener('visibilitychange',()=>{ if(!document.hidden && syncTokenGet()) syncPull().catch(()=>{}); });
window.addEventListener('focus',()=>{ if(syncTokenGet()) syncPull().catch(()=>{}); });
// Auto-resume on load if a token was saved on this device.
(function syncBoot(){
  const inp = document.getElementById('syncToken');
  if (syncTokenGet()) {
    syncConnect();
  }
  syncStatusSet('');
})();
// ================= END GITHUB SYNC =================

renderCalList();
render();
</script>
</body>
