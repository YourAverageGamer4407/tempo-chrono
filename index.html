<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHRONO // CALENDAR</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:       #080c10;
  --surface:  #0d1117;
  --surface2: #111820;
  --border:   #1e2d3d;
  --border2:  #243447;
  --accent:   #7dd8f0;
  --danger:   #f28b9a;
  --ok:       #7dddb0;
  --text:     #e6edf3;
  --text2:    #8b949e;
  --text3:    #3d5166;
  --mono:     'JetBrains Mono', 'Courier New', monospace;
}

body {
  font-family: 'Inter', -apple-system, sans-serif;
  background: var(--bg); color: var(--text);
  height: 100vh; display: flex; flex-direction: column; overflow: hidden;
}

/* TOPBAR */
.topbar {
  display: flex; align-items: center; gap: 12px;
  padding: 0 20px; height: 52px; flex-shrink: 0;
  background: var(--surface); border-bottom: 1px solid var(--border);
}
.logo { font-family: var(--mono); font-size: 13px; font-weight: 500; color: var(--accent); letter-spacing: 2px; white-space: nowrap; }
.logo span { color: var(--text3); }
.today-btn {
  padding: 5px 14px; border: 1px solid var(--border2); border-radius: 3px;
  cursor: pointer; font-size: 11px; font-family: var(--mono); letter-spacing: 1px;
  background: transparent; color: var(--text2); transition: all .15s;
}
.today-btn:hover { border-color: var(--accent); color: var(--accent); }
.nav-btns { display: flex; gap: 2px; }
.nav-btn {
  width: 30px; height: 30px; border: none; background: none; cursor: pointer;
  border-radius: 3px; font-size: 16px; color: var(--text2);
  display: flex; align-items: center; justify-content: center; transition: all .15s;
}
.nav-btn:hover { background: var(--border); color: var(--accent); }
.undo-btn:disabled { opacity: .3; cursor: default; }
.undo-btn:disabled:hover { background: none; color: var(--text2); }
.current-label { font-family: var(--mono); font-size: 13px; color: var(--text); min-width: 220px; letter-spacing: 1px; }
.view-switcher { margin-left: auto; display: flex; border: 1px solid var(--border2); border-radius: 3px; overflow: hidden; }
.view-btn {
  padding: 6px 14px; border: none; background: transparent; cursor: pointer;
  font-size: 10px; font-family: var(--mono); color: var(--text2); letter-spacing: 1px;
  border-left: 1px solid var(--border2); transition: all .15s;
}
.view-btn:first-child { border-left: none; }
.view-btn:hover { color: var(--accent); background: rgba(0,212,255,.05); }
.view-btn.active { background: rgba(0,212,255,.12); color: var(--accent); }

/* LAYOUT */
.calendar-wrap { display: flex; flex: 1; overflow: hidden; }

/* SIDEBAR */
.sidebar {
  width: 220px; padding: 14px 10px; background: var(--surface);
  border-right: 1px solid var(--border); flex-shrink: 0; overflow-y: auto;
}
.new-event-btn {
  display: flex; align-items: center; gap: 8px;
  padding: 9px 14px; margin: 0 4px 16px; width: calc(100% - 8px);
  background: rgba(0,212,255,.08); border: 1px solid rgba(0,212,255,.3);
  border-radius: 3px; cursor: pointer; font-size: 10px;
  font-family: var(--mono); color: var(--accent); letter-spacing: 1px; transition: all .15s;
}
.new-event-btn:hover { background: rgba(0,212,255,.15); border-color: var(--accent); }
.new-event-btn .plus { font-size: 15px; line-height: 1; }

.mini-header { display: flex; align-items: center; justify-content: space-between; padding: 2px 4px; margin-bottom: 6px; }
.mini-month { font-family: var(--mono); font-size: 10px; color: var(--text2); letter-spacing: 1px; }
.mini-nav { background: none; border: none; cursor: pointer; color: var(--text3); font-size: 14px; padding: 2px 5px; border-radius: 2px; transition: all .15s; }
.mini-nav:hover { color: var(--accent); }
.mini-grid { width: 100%; border-collapse: collapse; }
.mini-grid th { font-size: 9px; color: var(--text3); text-align: center; padding: 2px; font-family: var(--mono); }
.mini-grid td { text-align: center; padding: 1px; cursor: pointer; font-size: 10px; color: var(--text2); }
.mini-grid td span { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 2px; transition: all .12s; }
.mini-grid td:hover span { background: var(--border); color: var(--text); }
.mini-grid td.today span { background: rgba(0,212,255,.2); color: var(--accent); }
.mini-grid td.selected span { background: rgba(0,212,255,.12); color: var(--accent); outline: 1px solid rgba(0,212,255,.4); }
.mini-grid td.other-month { opacity: .3; }

/* MAIN */
.main-view { flex: 1; overflow: auto; background: var(--bg); }

/* MONTH */
.month-view { height: 100%; display: flex; flex-direction: column; }
.month-dow-header { display: grid; grid-template-columns: repeat(7, 1fr); border-bottom: 1px solid var(--border); }
.month-dow-header div { padding: 8px 10px; text-align: right; font-size: 9px; color: var(--text3); font-family: var(--mono); letter-spacing: 1px; }
.month-grid { flex: 1; display: grid; grid-template-columns: repeat(7, 1fr); grid-auto-rows: 1fr; border-left: 1px solid var(--border); }
.month-cell { border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); padding: 4px; min-height: 120px; cursor: pointer; position: relative; transition: background .1s; }
.month-cell:hover { background: var(--surface2); }
.month-cell.other-month .day-num { color: var(--text3); }
.month-cell.today .day-num span { background: var(--accent); color: var(--bg); border-radius: 2px; width: 22px; height: 22px; display: inline-flex; align-items: center; justify-content: center; }
.day-num { font-size: 10px; font-family: var(--mono); color: var(--text2); text-align: right; padding: 2px 4px 4px; }
.month-event { background: #7dd8f0; color: #080c10; border-left: none; border-radius: 3px; padding: 2px 6px; font-size: 10px; margin: 1px 0; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: var(--mono); font-weight: 600; transition: opacity .1s; }
.month-event:hover { opacity: .85; }
.month-event.ev-green  { background: #7dddb0; color: #080c10; }
.month-event.ev-red    { background: #f28b9a; color: #fff; }
.month-event.ev-yellow { background: #f5d57a; color: #080c10; }
.month-event.ev-purple { background: #c4b0f7; color: #080c10; }
.month-event.ev-teal   { background: #a8b8e8; color: #080c10; }
.month-event.ev-orange { background: #f5b07a; color: #080c10; }
.month-event.ev-lime   { background: #d8f07a; color: #080c10; }
.month-event.ev-pink   { background: #f7c8e0; color: #080c10; }

/* WEEK */
.week-view { display: flex; flex-direction: column; height: 100%; }
.week-header-row { display: grid; grid-template-columns: 56px repeat(7, 1fr); border-bottom: 1px solid var(--border); flex-shrink: 0; background: var(--surface); }
.week-header-cell { text-align: center; padding: 8px 4px; border-left: 1px solid var(--border); }
.week-header-cell .dow { font-size: 9px; color: var(--text3); font-family: var(--mono); letter-spacing: 1px; }
.week-header-cell .wdate { font-size: 20px; font-weight: 300; color: var(--text2); line-height: 1.4; display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 3px; cursor: pointer; font-family: var(--mono); transition: all .12s; }
.week-header-cell .wdate:hover { background: var(--border); color: var(--text); }
.week-header-cell.today .wdate { background: rgba(0,212,255,.15); color: var(--accent); outline: 1px solid rgba(0,212,255,.4); }
.week-time-grid { flex: 1; overflow-y: auto; display: grid; grid-template-columns: 56px repeat(7, 1fr); position: relative; }
.time-labels { display: flex; flex-direction: column; }
.time-label { height: var(--hh, 64px); display: flex; align-items: flex-start; justify-content: flex-end; padding-right: 8px; font-size: 9px; color: var(--text3); font-family: var(--mono); flex-shrink: 0; padding-top: 3px; }
.week-day-col { border-left: 1px solid var(--border); position: relative; cursor: pointer; }
.hour-line { height: var(--hh, 64px); border-bottom: 1px solid rgba(30,45,61,.7); }
.week-event { position: absolute; left: 2px; right: 2px; border-left: none; background: #7dd8f0; color: #080c10; border-radius: 3px; padding: 2px 4px; font-size: 10px; cursor: pointer; overflow: hidden; z-index: 1; font-family: var(--mono); font-weight: 600; transition: opacity .1s; }
.week-event { border: 1px solid rgba(0,0,0,.35); box-shadow: 0 1px 2px rgba(0,0,0,.4); display: flex; flex-direction: column; }
.week-event .ev-time { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.2; }
.week-event .ev-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.2; }
.week-event:hover { opacity: .85; }
.week-event.ev-green  { background: #7dddb0; color: #080c10; }
.week-event.ev-red    { background: #f28b9a; color: #fff; }
.week-event.ev-yellow { background: #f5d57a; color: #080c10; }
.week-event.ev-purple { background: #c4b0f7; color: #080c10; }
.week-event.ev-teal   { background: #a8b8e8; color: #080c10; }
.week-event.ev-orange { background: #f5b07a; color: #080c10; }
.week-event.ev-lime   { background: #d8f07a; color: #080c10; }
.week-event.ev-pink   { background: #f7c8e0; color: #080c10; }
.now-line { position: absolute; left: 0; right: 0; border-top: 1px solid var(--danger); z-index: 2; opacity: .8; }
.now-line::before { content: ''; position: absolute; left: -4px; top: -4px; width: 7px; height: 7px; background: var(--danger); border-radius: 50%; }

/* DAY */
.day-view { display: flex; flex-direction: column; height: 100%; }
.day-header { text-align: center; padding: 10px; border-bottom: 1px solid var(--border); flex-shrink: 0; background: var(--surface); }
.day-header .dow { font-size: 9px; color: var(--text3); font-family: var(--mono); letter-spacing: 2px; }
.day-header .ddate { font-size: 32px; font-weight: 300; color: var(--text2); line-height: 1.2; display: inline-flex; align-items: center; justify-content: center; width: 52px; height: 52px; border-radius: 4px; font-family: var(--mono); }
.day-header.today .ddate { background: rgba(0,212,255,.12); color: var(--accent); outline: 1px solid rgba(0,212,255,.3); }
.day-time-grid { flex: 1; overflow-y: auto; display: grid; grid-template-columns: 56px 1fr; position: relative; }
.day-col { border-left: 1px solid var(--border); position: relative; cursor: pointer; }
.day-event { position: absolute; left: 4px; right: 4px; border-left: none; background: #7dd8f0; color: #080c10; border-radius: 3px; padding: 4px 8px; font-size: 11px; cursor: pointer; overflow: hidden; z-index: 1; font-family: var(--mono); font-weight: 600; transition: opacity .1s; }
.day-event { border: 1px solid rgba(0,0,0,.35); box-shadow: 0 1px 2px rgba(0,0,0,.4); }
.day-event:hover { opacity: .85; }
.day-event.ev-green  { background: #7dddb0; color: #080c10; }
.day-event.ev-red    { background: #f28b9a; color: #fff; }
.day-event.ev-yellow { background: #f5d57a; color: #080c10; }
.day-event.ev-purple { background: #c4b0f7; color: #080c10; }
.day-event.ev-teal   { background: #a8b8e8; color: #080c10; }
.day-event.ev-orange { background: #f5b07a; color: #080c10; }
.day-event.ev-lime   { background: #d8f07a; color: #080c10; }
.day-event.ev-pink   { background: #f7c8e0; color: #080c10; }

/* MODAL */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.75); backdrop-filter: blur(4px); z-index: 100; align-items: center; justify-content: center; }
.modal-overlay.open { display: flex; }
.modal { background: var(--surface); border: 1px solid var(--border2); border-radius: 4px; width: 500px; max-width: 95vw; box-shadow: 0 20px 60px rgba(0,0,0,.8); overflow: hidden; }
.modal-header { display: flex; align-items: center; padding: 14px 20px 12px; gap: 10px; border-bottom: 1px solid var(--border); }
.modal-header h3 { font-size: 12px; font-weight: 500; font-family: var(--mono); color: var(--accent); letter-spacing: 1px; flex: 1; }
.modal-close { background: none; border: none; cursor: pointer; font-size: 15px; color: var(--text3); padding: 4px 8px; border-radius: 2px; transition: all .12s; }
.modal-close:hover { color: var(--danger); }
.modal-body { padding: 16px 20px; }
.form-row { margin-bottom: 13px; }
.form-row label { display: block; font-size: 9px; color: var(--text3); margin-bottom: 5px; font-family: var(--mono); letter-spacing: 1px; }
.form-row input, .form-row textarea, .form-row select { width: 100%; padding: 7px 10px; border: 1px solid var(--border); border-radius: 3px; font-size: 12px; color: var(--text); background: var(--bg); outline: none; font-family: var(--mono); transition: border-color .15s; }
.form-row input:focus, .form-row textarea:focus, .form-row select:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(0,212,255,.08); }
.form-row textarea { resize: vertical; min-height: 54px; }
.form-row select option { background: var(--surface2); }
.form-row-inline { display: flex; gap: 12px; }
.form-row-inline .form-row { flex: 1; }

.recur-section { margin-bottom: 13px; }
.recur-section > label { display: block; font-size: 9px; color: var(--text3); margin-bottom: 6px; font-family: var(--mono); letter-spacing: 1px; }
.recur-opts { display: flex; gap: 5px; flex-wrap: wrap; }
.recur-opt { padding: 5px 11px; border: 1px solid var(--border); border-radius: 2px; font-size: 10px; font-family: var(--mono); color: var(--text2); cursor: pointer; transition: all .12s; background: transparent; letter-spacing: .5px; }
.recur-opt:hover { border-color: var(--border2); color: var(--text); }
.recur-opt.active { border-color: var(--accent); color: var(--accent); background: rgba(0,212,255,.08); }
.recur-end-row { margin-top: 8px; display: none; }
.recur-end-row.show { display: block; }

.weekly-days-row { margin-top: 8px; display: none; }
.weekly-days-row.show { display: block; }
.weekly-days-row > label { display: block; font-size: 9px; color: var(--text3); margin-bottom: 6px; font-family: var(--mono); letter-spacing: 1px; }
.weekly-day-btns { display: flex; gap: 5px; }
.weekly-day-btn { flex: 1; padding: 6px 2px; border: 1px solid var(--border); border-radius: 2px; font-size: 9px; font-family: var(--mono); color: var(--text2); cursor: pointer; background: transparent; letter-spacing: .5px; transition: all .12s; text-align: center; }
.weekly-day-btn:hover { border-color: var(--border2); color: var(--text); }
.weekly-day-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(0,212,255,.08); }

.category-picker { display: flex; gap: 6px; flex-wrap: wrap; }
.cat-btn {
  display: flex; align-items: center; gap: 6px;
  padding: 6px 11px; border: 1px solid var(--border); border-radius: 2px;
  font-size: 9px; font-family: var(--mono); letter-spacing: 1px;
  color: var(--text2); background: transparent; cursor: pointer; transition: all .12s;
}
.cat-btn:hover { border-color: var(--border2); color: var(--text); }
.cat-btn.active { color: #fff; }
.cat-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.legend { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--border); }
.legend-title { font-size: 9px; color: var(--text3); font-family: var(--mono); letter-spacing: 1px; margin-bottom: 8px; padding: 0 4px; }
.legend-item { display: flex; align-items: center; gap: 8px; padding: 3px 4px; font-size: 10px; font-family: var(--mono); color: var(--text2); }
.legend-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

.modal-footer { display: flex; justify-content: flex-end; gap: 8px; padding: 10px 20px 14px; border-top: 1px solid var(--border); }
.btn { padding: 7px 16px; border-radius: 3px; font-size: 10px; cursor: pointer; font-weight: 500; border: none; font-family: var(--mono); letter-spacing: 1px; transition: all .15s; }
.btn-ghost { background: transparent; color: var(--text2); border: 1px solid var(--border); }
.btn-ghost:hover { border-color: var(--border2); color: var(--text); }
.btn-primary { background: rgba(0,212,255,.12); color: var(--accent); border: 1px solid rgba(0,212,255,.4); }
.btn-primary:hover { background: rgba(0,212,255,.22); border-color: var(--accent); }
.btn-danger { background: rgba(255,59,92,.1); color: var(--danger); border: 1px solid rgba(255,59,92,.35); }
.btn-danger:hover { background: rgba(255,59,92,.2); }

/* RECUR DIALOG */
.recur-dialog { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.8); backdrop-filter: blur(4px); z-index: 110; align-items: center; justify-content: center; }
.recur-dialog.open { display: flex; }
.recur-box { background: var(--surface); border: 1px solid var(--border2); border-radius: 4px; padding: 24px; width: 320px; box-shadow: 0 20px 60px rgba(0,0,0,.9); }
.recur-box h4 { font-family: var(--mono); font-size: 11px; color: var(--accent); letter-spacing: 1px; margin-bottom: 16px; }
.recur-choices { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
.recur-choices label { display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 11px; color: var(--text2); font-family: var(--mono); padding: 8px 10px; border: 1px solid var(--border); border-radius: 3px; transition: all .12s; }
.recur-choices label:hover { border-color: var(--border2); color: var(--text); }
.recur-choices input[type=radio] { accent-color: var(--accent); }
.recur-actions { display: flex; justify-content: flex-end; gap: 8px; }

/* DETAIL */
.detail-popup { display: none; position: fixed; z-index: 90; background: var(--surface); border: 1px solid var(--border2); border-radius: 4px; box-shadow: 0 8px 40px rgba(0,0,0,.8); width: 270px; overflow: hidden; }
.detail-popup.open { display: block; }
.detail-top { padding: 8px 10px; display: flex; justify-content: flex-end; gap: 4px; border-bottom: 1px solid var(--border); }
.detail-top button { background: none; border: none; cursor: pointer; color: var(--text3); padding: 4px 7px; border-radius: 2px; font-size: 12px; transition: all .12s; }
.detail-top button:hover { color: var(--accent); background: var(--border); }
.detail-top button.del:hover { color: var(--danger); }
.detail-body { padding: 12px 14px 14px; }
.detail-title { font-size: 14px; font-weight: 500; margin-bottom: 7px; display: flex; align-items: center; gap: 8px; font-family: var(--mono); color: var(--text); }
.detail-color-bar { width: 3px; height: 16px; border-radius: 1px; flex-shrink: 0; }
.detail-time { font-size: 10px; color: var(--text2); margin-bottom: 3px; font-family: var(--mono); }
.detail-recur { font-size: 10px; color: var(--accent); font-family: var(--mono); margin-bottom: 3px; }
.detail-desc { font-size: 10px; color: var(--text3); white-space: pre-wrap; }

/* CUSTOM DAY PICKER */
.custom-day-grid { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; }
.custom-day-btn {
  flex: 1; min-width: 44px; padding: 10px 4px; border: 1px solid var(--border);
  border-radius: 3px; background: transparent; color: var(--text2);
  font-size: 10px; font-family: var(--mono); letter-spacing: 1px; cursor: pointer;
  transition: all .15s;
}
.custom-day-btn:hover { border-color: var(--border2); color: var(--text); }
.custom-day-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(0,212,255,.1); }
.custom-presets { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.preset-label { font-size: 9px; color: var(--text3); font-family: var(--mono); letter-spacing: 1px; }

::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }
::-webkit-scrollbar-thumb:hover { background: var(--text3); }
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">CHRONO<span> //</span></div>
  <button class="today-btn" onclick="goToday()">TODAY</button>
  <div class="nav-btns">
    <button class="nav-btn" onclick="navPrev()">&#8249;</button>
    <button class="nav-btn" onclick="navNext()">&#8250;</button>
  </div>
   <div class="nav-btns" style="margin-left:6px;border-left:1px solid var(--border2);padding-left:6px">
     <button class="nav-btn undo-btn" id="btnUndo" onclick="doUndo()" title="Undo (Ctrl+Z)">&#8630;</button>
     <button class="nav-btn undo-btn" id="btnRedo" onclick="doRedo()" title="Redo (Ctrl+Y)">&#8631;</button>
   </div>
   <select id="timeFmt" onchange="setTimeFmt(this.value)" title="Time format" style="margin-left:8px;background:var(--surface2);color:var(--text2);border:1px solid var(--border2);border-radius:3px;font-family:var(--mono);font-size:10px;letter-spacing:1px;padding:5px 8px;cursor:pointer"><option value="12">12H</option><option value="24">24H</option></select>
   <select id="hourZoom" onchange="setHourZoom(this.value)" title="Time grid height" style="margin-left:8px;background:var(--surface2);color:var(--text2);border:1px solid var(--border2);border-radius:3px;font-family:var(--mono);font-size:10px;letter-spacing:1px;padding:5px 8px;cursor:pointer">
     <option value="auto">AUTO</option>
     <option value="48">COMPACT</option>
     <option value="64">NORMAL</option>
     <option value="80">TALL</option>
     <option value="160">XL</option>
   </select>
  <div class="current-label" id="currentLabel"></div>
  <div class="view-switcher">

<script>
const DAYS   = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
const WDAYS  = ['MON','TUE','WED','THU','FRI','SAT','SUN']; // Monday-first column order
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const COLOR_HEX = { '':'#7dd8f0','ev-green':'#7dddb0','ev-red':'#f28b9a','ev-yellow':'#f5d57a','ev-purple':'#c4b0f7','ev-teal':'#a8b8e8','ev-orange':'#f5b07a','ev-lime':'#d8f07a','ev-pink':'#f7c8e0' };
const CAT_LABEL = { '':'WORK','ev-green':'PERSONAL','ev-orange':'FITNESS','ev-yellow':'TRAVEL','ev-teal':'SLEEP','ev-purple':'FINANCE','ev-red':'SOCIAL','ev-lime':'MEALS','ev-pink':'HYGIENE' };
const RECUR_LBL = { none:'', daily:'↻ DAILY', weekly:'↻ WEEKLY', monthly:'↻ MONTHLY', yearly:'↻ YEARLY' };
function recurLabel(ev) {
  if (!ev.recurrence || ev.recurrence === 'none') return '';
  if (ev.recurrence === 'weekly' && ev.weeklyDays && ev.weeklyDays.length) {
    const names = ev.weeklyDays.sort((a,b)=>a-b).map(d=>DAYS[d]);
    return '↻ WEEKLY · ' + names.join(', ');
  }
  return RECUR_LBL[ev.recurrence] || '';
}

let today      = new Date();
let cursor     = new Date(today);
let view       = 'week';
let customDays = JSON.parse(localStorage.getItem('chrono_custom_days') || '[1,2,3,4,5]'); // Mon–Fri default
let events     = JSON.parse(localStorage.getItem('chrono_v2_events')     || '[]');
let exceptions = JSON.parse(localStorage.getItem('chrono_v2_exceptions') || '{}');

// ---- SEED: workout schedule v2 (post-work, after changeover 15:30-16:00) ----
(function seedWorkouts(){
  // Always reconcile: wipe any existing workout seeds and re-apply current schedule
  events = events.filter(e => !(e.id||'').startsWith('seed-w-'));
 // NOTE: sleep seeds are NOT stripped here - reconciled separately below so user edits to sleep survive reloads
  const mk = (id,title,date,start,end,color,days,desc)=>({
    id, title, date, allDay:false, start, end, desc:desc||'', color,
    recurrence:'weekly', recurrenceEnd:'', weeklyDays:days
  });
  // Normal days: Work ends 16:30, Drive to Barracks 16:30-16:40, Changeover 16:40-16:50 -> block starts 16:50.
  // Thursday: Field Day ends 17:30 -> block starts 17:30.
  const days = [
    ['mon',1,'2026-11-02','Gym','Push Workout','Push day - see workout app for exercises','16:50'],
    ['tue',2,'2026-11-03','Gym','Pull Workout','Pull day - see workout app for exercises','16:50'],
    ['wed',3,'2026-11-04','Track','3-Mile Run','3-mile run - pace work toward sub-18:00','16:50'],
    ['thu',4,'2026-11-05','Gym','Legs Workout','Legs day - after Field Day','17:30'],
    ['fri',5,'2026-11-06','Gym','Upper Workout','Upper day - see workout app for exercises','16:50'],
    ['sat',6,'2026-11-07','Track','Easy Run','Easy aerobic run','16:50'],
  ];
  const addMin = function(t,m){ const p=t.split(':'); const tot=(+p[0])*60+(+p[1])+m; return String(Math.floor(tot/60)).padStart(2,'0')+':'+String(tot%60).padStart(2,'0'); };
  const seeds = [];
  days.forEach(function(d){
    const k=d[0], wd=d[1], dt=d[2], dest=d[3], wo=d[4], desc=d[5], t0=d[6];
    seeds.push(mk('seed-w-'+k+'-d1','Drive to '+dest, dt, t0,           addMin(t0,10),  'ev-yellow',[wd]));
    seeds.push(mk('seed-w-'+k+'-wo',wo,              dt, addMin(t0,10), addMin(t0,80),  'ev-orange',[wd],desc));
    seeds.push(mk('seed-w-'+k+'-d2','Drive to Barracks', dt, addMin(t0,80), addMin(t0,90),  'ev-yellow',[wd]));
    seeds.push(mk('seed-w-'+k+'-hy','Hygiene & Changeover into Civvies',       dt, addMin(t0,90), addMin(t0,120), 'ev-pink',[wd]));
  });
  // ---- SLEEP: one overnight event 21:30 -> 05:30 next day (8h), every day ----
  // Seed when missing; heal the old 22:30-06:30 default to 21:30-05:30 exactly once.
  // If the Commander has customized the times to anything else, leave his event alone.
  const allWk = [0,1,2,3,4,5,6];
  const sleepEv = events.find(e => (e.id||'').startsWith('seed-sleep-'));
  if (!sleepEv) {
    seeds.push(mk('seed-sleep-night','Sleep','2026-11-01','21:30','05:30','ev-teal',allWk,'Sleep'));
  } else if (sleepEv.start === '22:30' && sleepEv.end === '06:30') {
    sleepEv.start = '21:30';
    sleepEv.end   = '05:30';
  }
  events = events.concat(seeds);
  localStorage.setItem('chrono_v2_events', JSON.stringify(events));
})();
let editingId  = null;
let editingOcc = null;
let detailId   = null;
let detailOcc  = null;
let miniCursor = new Date(today);
let selRecur      = 'none';
let selWeeklyDays = [];
let pendingAct = null;
let pendingDat = null;

// ---- HOUR ZOOM ----
let HOUR_ZOOM_MODE = localStorage.getItem('chrono_hour_zoom_mode') || '64';
let HOUR_PX = HOUR_ZOOM_MODE === 'auto' ? 64 : (parseInt(HOUR_ZOOM_MODE, 10) || 64);
// AUTO: smallest hour height where the shortest visible timed event's card
// still fits a time line + title line (~40px). Clamped 64..220.
function computeAutoHourPx() {
  let minDur = Infinity;
  const todayDs = todayStr();
  const ws = wkStart(cursor);
  const rangeStart = dateStr(new Date(ws.getTime() - 7 * 864e5));
  const rangeEnd = dateStr(new Date(ws.getTime() + 14 * 864e5));
  try {
    const all = expandRange(rangeStart, rangeEnd);
    all.forEach(x => {
      const ev = x.ev;
      if (ev.allDay || !ev.start || !ev.end) return;
      const a = (x.cs||ev.start).split(':'), b = (x.ce||ev.end).split(':');
      let dur = (+b[0]) * 60 + (+b[1]) - ((+a[0]) * 60 + (+a[1]));
      if (dur <= 0) dur += 1440;
      if (dur > 0 && dur < minDur) minDur = dur;
    });
  } catch (e) { /* fall through to default */ }
  if (!isFinite(minDur)) return 64;
  return Math.min(520, Math.max(64, Math.ceil(44 * 60 / minDur)));
}
function applyHourPx(px) {
  HOUR_PX = px;
  document.documentElement.style.setProperty('--hh', HOUR_PX + 'px');
}
function refreshZoom() {
  if (HOUR_ZOOM_MODE === 'auto') applyHourPx(computeAutoHourPx());
  else applyHourPx(parseInt(HOUR_ZOOM_MODE, 10) || 64);
}
function setHourZoom(v) {
  HOUR_ZOOM_MODE = v;
  localStorage.setItem('chrono_hour_zoom_mode', v);
  refreshZoom();
  render();
}
function applyHourZoomUI() {
  refreshZoom();
  const s = document.getElementById('hourZoom');
  if (s) s.value = HOUR_ZOOM_MODE;
  render(); // re-render with computed AUTO height (initial render used default HOUR_PX)
}
if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', applyHourZoomUI); } else { applyHourZoomUI(); }

function saveAll() {
  localStorage.setItem('chrono_v2_events', JSON.stringify(events));
  localStorage.setItem('chrono_v2_exceptions', JSON.stringify(exceptions));
  if (typeof HOUR_ZOOM_MODE !== 'undefined' && HOUR_ZOOM_MODE === 'auto') refreshZoom();
}
// ---- UNDO / REDO ----
let undoStack=[], redoStack=[], applyingHistory=false;
const UNDO_LIMIT=100;
function snapshotState(){return JSON.stringify({events,exceptions});}
function pushHistory(){
  undoStack.push(snapshotState());
  if(undoStack.length>UNDO_LIMIT)undoStack.shift();
  redoStack=[];
  updateUndoRedoUI();
}
function restoreState(snap){
  const s=JSON.parse(snap);
  events=s.events;exceptions=s.exceptions;
  applyingHistory=true;
  saveAll();
  applyingHistory=false;
  closeDetail();closeRecurDialog();
  render();
  updateUndoRedoUI();
}
function doUndo(){
  if(!undoStack.length)return;
  redoStack.push(snapshotState());
  restoreState(undoStack.pop());
}
function doRedo(){
  if(!redoStack.length)return;
  undoStack.push(snapshotState());
  restoreState(redoStack.pop());
}
function updateUndoRedoUI(){
  const u=document.getElementById('btnUndo'),r=document.getElementById('btnRedo');
  if(u)u.disabled=!undoStack.length;
  if(r)r.disabled=!redoStack.length;
}
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&!e.shiftKey&&(e.key==='z'||e.key==='Z')){
    const t=e.target;
    if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'))return;
    e.preventDefault();doUndo();
  } else if(((e.ctrlKey||e.metaKey)&&(e.key==='y'||e.key==='Y'))||((e.ctrlKey||e.metaKey)&&e.shiftKey&&(e.key==='z'||e.key==='Z'))){
    const t=e.target;
    if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'))return;
    e.preventDefault();doRedo();
  }
});
if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',updateUndoRedoUI);}else{updateUndoRedoUI();}
function uid() { return Date.now().toString(36)+Math.random().toString(36).slice(2); }
function dateStr(d) { return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function todayStr() { return dateStr(today); }
function parseLocal(s) { return new Date(s+'T00:00:00'); }

// ---- TIME FORMAT (12h / 24h) ----
let TIME_FMT = localStorage.getItem('chrono_time_fmt') || '12';
function fmtTime(t) {
  if (!t) return '';
  const p = t.split(':'); let h = +p[0]; const m = p[1];
  if (TIME_FMT === '24') return String(h).padStart(2,'0') + ':' + m;
  const ap = h < 12 ? 'AM' : 'PM'; let hh = h % 12; if (hh === 0) hh = 12;
  return hh + ':' + m + ap;
}
function fmtHourLbl(i) {
  if (TIME_FMT === '24') return String(i).padStart(2,'0') + ':00';
  if (i === 0) return '12AM'; if (i < 12) return i + 'AM'; if (i === 12) return '12PM'; return (i - 12) + 'PM';
}
function setTimeFmt(v) { TIME_FMT = v; localStorage.setItem('chrono_time_fmt', v); render(); }
function applyTimeFmtUI() { const s = document.getElementById('timeFmt'); if (s) s.value = TIME_FMT; }
if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', applyTimeFmtUI); } else { applyTimeFmtUI(); }

// ---- EXPAND RECURRENCES ----
// Overnight events (end <= start) are clipped per day: the start day shows
// cs=ev.start..ce=24:00 and the following day shows cs=00:00..ce=ev.end (cont).
function overnight(ev){
  if (ev.allDay || !ev.start || !ev.end) return false;
  const a=ev.start.split(':'), b=ev.end.split(':');
  return ((+b[0])*60+(+b[1])) <= ((+a[0])*60+(+a[1]));
}
function pushOcc(result, ev, occ, startDs, endDs){
  if (overnight(ev)) {
    // An overnight event is ONE continuous block crossing midnight. For per-day
    // grids/stats it is clipped at midnight, but BOTH halves must be emitted
    // whenever the portion falls inside [startDs, endDs] — including the
    // morning continuation of a night that STARTED before the window.
    if (occ >= startDs && occ <= endDs) result.push({ ev, occ, cs: ev.start, ce: '24:00' });
    const nd = dateStr(new Date(parseLocal(occ).getTime() + 864e5));
    if (nd >= startDs && nd <= endDs) result.push({ ev, occ: nd, cs: '00:00', ce: ev.end, cont: occ });
  } else {
    if (occ >= startDs && occ <= endDs) result.push({ ev, occ });
  }
}
function expandRange(startDs, endDs) {
  const result = [];
  // Scan one day EARLIER than the window so overnight events that began the
  // night before startDs still contribute their in-window morning half.
  const scanStart = dateStr(new Date(parseLocal(startDs).getTime() - 864e5));
  events.forEach(ev => {
    const exList = exceptions[ev.id] || [];
    if (!ev.recurrence || ev.recurrence === 'none') {
      if (ev.date >= scanStart && ev.date <= endDs && !exList.includes(ev.date))
        pushOcc(result, ev, ev.date, startDs, endDs);
      return;
    }
    // weekly with specific days: iterate every day in range, match by weekday
    if (ev.recurrence === 'weekly' && ev.weeklyDays && ev.weeklyDays.length) {
      const cap = ev.recurrenceEnd || endDs;
      const rangeStart = parseLocal(scanStart);
      let cur = new Date(rangeStart);
      let safety = 0;
      while (dateStr(cur) <= endDs && dateStr(cur) <= cap && safety++ < 1000) {
        const ds = dateStr(cur);
        if (ds >= ev.date && ev.weeklyDays.includes(cur.getDay()) && !exList.includes(ds))
          pushOcc(result, ev, ds, startDs, endDs);
        cur.setDate(cur.getDate() + 1);
      }
      return;
    }
    const cap = ev.recurrenceEnd || endDs;
    let cur = parseLocal(ev.date);
    let safety = 0;
    while (dateStr(cur) <= endDs && dateStr(cur) <= cap && safety++ < 3650) {
      const ds = dateStr(cur);
      if (ds >= scanStart && !exList.includes(ds)) pushOcc(result, ev, ds, startDs, endDs);
      cur = nextOcc(cur, ev.recurrence);
    }
  });
  return result;
}
function nextOcc(d, r) {
  const n = new Date(d);
  if (r==='daily')   n.setDate(n.getDate()+1);
  else if (r==='weekly')  n.setDate(n.getDate()+7);
  else if (r==='monthly') n.setMonth(n.getMonth()+1);
  else if (r==='yearly')  n.setFullYear(n.getFullYear()+1);
  return n;
}

function renderWeek() {

  });

    const dayEvs=all.filter(x=>x.occ===ds&&!x.ev.allDay);
    const lay=layoutOverlap(dayEvs);
    dayEvs.forEach(({ev,occ,cs,ce,cont})=>{
      const csT=cs||ev.start, ceT=ce||ev.end;
      const [sh,sm]=csT.split(':').map(Number),[eh,em]=ceT.split(':').map(Number);
      const top=(sh*60+sm)/60*HOUR_PX;
      const ht=Math.max(((eh*60+em)-(sh*60+sm))/60*HOUR_PX,8);
      const rm=ev.recurrence&&ev.recurrence!=='none'?'↻ ':'';
      const L=lay[ev.id+'|'+occ]||{left:0,width:100};
      h += `<div class="week-event ${ev.color||''}" style="top:${top}px;height:${ht}px;left:calc(${L.left}% + 1px);width:calc(${L.width}% - 2px);right:auto" onclick="showDetail(event,'${ev.id}','${occ}')"><div class="ev-time">${fmtTime(csT)}–${fmtTime(ceT)}</div><div class="ev-name">${rm}${ev.title}</div></div>`;
    });
    if(isT){const n=new Date(),p=(n.getHours()*60+n.getMinutes())/60*HOUR_PX;h+=`<div class="now-line" style="top:${p}px"></div>`;}
    h += '</div>';
  });
  mv.innerHTML = h+'</div></div>';
  setTimeout(()=>{const tg=mv.querySelector('.week-time-grid');if(tg)tg.scrollTop=7*HOUR_PX;},0);
}

function layoutOverlap(items){
  // items: [{ev,occ,cs,ce}] -> map from ev.id+occ to {leftPct,widthPct}
  const evs=items.map(({ev,occ,cs,ce})=>{
    const [sh,sm]=(cs||ev.start).split(':').map(Number),[eh,em]=(ce||ev.end).split(':').map(Number);
    return {ev,occ,s:sh*60+sm,e:eh*60+em};
  }).sort((a,b)=>a.s-b.s||b.e-a.e);
  const res={},active=[],clusters=[];
  let cluster=null,clusterEnd=-1;
  for(const it of evs){
    if(!cluster||it.s>=clusterEnd){ if(cluster)clusters.push(cluster); cluster=[it]; clusterEnd=it.e; }
    else{ cluster.push(it); clusterEnd=Math.max(clusterEnd,it.e); }
  }
  if(cluster)clusters.push(cluster);
  for(const cl of clusters){
    const lanes=[]; // each lane = end time
    for(const it of cl){
      let placed=false;
      for(let i=0;i<lanes.length;i++){
        if(it.s>=lanes[i]){lanes[i]=it.e;res[it.ev.id+'|'+it.occ]={lane:i};placed=true;break;}
      }
      if(!placed){res[it.ev.id+'|'+it.occ]={lane:lanes.length};lanes.push(it.e);}
    }
    const n=lanes.length;
    for(const it of cl){
      const k=it.ev.id+'|'+it.occ, l=res[k].lane;
      res[k].left=(l/n*100); res[k].width=(100/n);
    }
  }
  return res;
}

  document.getElementById('recurDialog').classList.add('open');
}

  const scope=document.querySelector('input[name=recurScope]:checked').value;

    if(scope==='all'){events=events.filter(e=>e.id!==editingId);delete exceptions[editingId];}

  } else if(pendingAct==='save'){
    if(scope==='all'){const i=events.findIndex(e=>e.id===editingId);if(i>=0)events[i]={id:editingId,...pendingDat};}
    else{if(!exceptions[editingId])exceptions[editingId]=[];exceptions[editingId].push(editingOcc);events.push({id:uid(),...pendingDat,recurrence:'none',recurrenceEnd:''});}
  }
  saveAll();render();pendingAct=null;pendingDat=null;
}

function renderCustom() {
  const mv = document.getElementById('mainView');
  if (!customDays.length) {

  const sorted = [...customDays].sort((a,b)=>a-b);

  const firstDay = sorted[0];
  const diff = (curDay - firstDay + 7) % 7;
  anchor.setDate(anchor.getDate() - diff);

  const cols = sorted.map(d => {
    const offset = (d - firstDay + 7) % 7;
    const cd = new Date(anchor);
    cd.setDate(anchor.getDate() + offset);
    return cd;
  });

  const startDs = dateStr(cols[0]), endDs = dateStr(cols[cols.length-1]);
  const all = expandRange(startDs, endDs);
  const colCount = cols.length;

  let h = `<div class="week-view"><div class="week-header-row" style="grid-template-columns:56px repeat(${colCount},1fr)"><div></div>`;
  cols.forEach(d => {
    const isT = dateStr(d)===todayStr();
    h += `<div class="week-header-cell${isT?' today':''}"><div class="dow">${DAYS[d.getDay()]}</div><div class="wdate" onclick="goDay('${dateStr(d)}')">${d.getDate()}</div></div>`;
  });
  h += `</div><div class="week-time-grid" style="grid-template-columns:56px repeat(${colCount},1fr)"><div class="time-labels">`;
  for(let i=0;i<24;i++) h += `<div class="time-label">${i===0?'':fmtHourLbl(i)}</div>`;
  h += '</div>';
  cols.forEach(d => {
    const ds=dateStr(d), isT=ds===todayStr();
    h += `<div class="week-day-col" onclick="colClick('${ds}',event)">`;
    for(let i=0;i<24;i++) h += `<div class="hour-line"></div>`;
    const dayEvs=all.filter(x=>x.occ===ds&&!x.ev.allDay);
    const lay=layoutOverlap(dayEvs);
    dayEvs.forEach(({ev,occ,cs,ce,cont})=>{
      const csT=cs||ev.start, ceT=ce||ev.end;
      const [sh,sm]=csT.split(':').map(Number),[eh,em]=ceT.split(':').map(Number);
      const top=(sh*60+sm)/60*HOUR_PX;
      const ht=Math.max(((eh*60+em)-(sh*60+sm))/60*HOUR_PX,8);
      const rm=ev.recurrence&&ev.recurrence!=='none'?'↻ ':'';
      const L=lay[ev.id+'|'+occ]||{left:0,width:100};
      h += `<div class="week-event ${ev.color||''}" style="top:${top}px;height:${ht}px;left:calc(${L.left}% + 1px);width:calc(${L.width}% - 2px);right:auto" onclick="showDetail(event,'${ev.id}','${occ}')"><div class="ev-time">${fmtTime(csT)}–${fmtTime(ceT)}</div><div class="ev-name">${rm}${ev.title}</div></div>`;
    });
    if(isT){const n=new Date(),p=(n.getHours()*60+n.getMinutes())/60*HOUR_PX;h+=`<div class="now-line" style="top:${p}px"></div>`;}
    h += '</div>';
  });
  mv.innerHTML = h+'</div></div>';
  setTimeout(()=>{const tg=mv.querySelector('.week-time-grid');if(tg)tg.scrollTop=7*HOUR_PX;},0);
}

function navCustomPrev() {
  if(!customDays.length)return;
  cursor.setDate(cursor.getDate()-7); miniCursor=new Date(cursor); render();
}
function navCustomNext() {
  if(!customDays.length)return;
  cursor.setDate(cursor.getDate()+7); miniCursor=new Date(cursor); render();
}



// ---- CUSTOM CFG MODAL ----
function openCustomCfg() {
  // sync button states
  document.querySelectorAll('.custom-day-btn').forEach(btn => {
    const d = parseInt(btn.dataset.d);
    btn.classList.toggle('active', customDays.includes(d));
  });
  document.getElementById('customCfgOverlay').classList.add('open');
}
function closeCustomCfg() { document.getElementById('customCfgOverlay').classList.remove('open'); }
function closeCustomCfgOverlay(e) { if(e.target===document.getElementById('customCfgOverlay'))closeCustomCfg(); }

document.querySelectorAll('.custom-day-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const d = parseInt(btn.dataset.d);
    if (customDays.includes(d)) {
      if (customDays.length === 1) return; // keep at least 1
      customDays = customDays.filter(x=>x!==d);
    } else {
      customDays.push(d);
    }
    btn.classList.toggle('active', customDays.includes(d));
  });
});

function applyPreset(days) {
  customDays = [...days];
  document.querySelectorAll('.custom-day-btn').forEach(btn => {
    btn.classList.toggle('active', customDays.includes(parseInt(btn.dataset.d)));
  });
}

function saveCustomCfg() {
  localStorage.setItem('chrono_custom_days', JSON.stringify(customDays));
  closeCustomCfg();
  if (view==='custom') render();
}

// ---- STATS VIEW ----
function renderStats() {
  const mv = document.getElementById('mainView');
  // 7-day window: current week Sun-Sat
  const ws = wkStart(cursor);
  const sd = dateStr(ws), ed = dateStr(new Date(ws.getTime() + 6*864e5));
  const all = expandRange(sd, ed);

  // Accumulate minutes per category (and per 8/8/8 bucket)
  const catMin = {};   // color -> minutes
  const bucketMin = { work:0, sleep:0, personal:0 };
  const BUCKET = { '':'work','ev-yellow':'work','ev-teal':'sleep',
    'ev-green':'personal','ev-orange':'personal','ev-lime':'personal',
    'ev-pink':'personal','ev-red':'personal','ev-purple':'personal' };
  let totalMin = 0;
  all.forEach(({ev, cs, ce}) => {
    if (ev.allDay || !ev.start || !ev.end) return;
    const a = (cs||ev.start).split(':'), b = (ce||ev.end).split(':');
    let dur = (+b[0])*60 + (+b[1]) - ((+a[0])*60 + (+a[1]));
    if (dur <= 0) dur += 1440;
    const c = ev.color || '';
    catMin[c] = (catMin[c]||0) + dur;
    bucketMin[BUCKET[c]||'personal'] += dur;
    totalMin += dur;
  });

  const cats = Object.keys(catMin).sort((a,b)=>catMin[b]-catMin[a]);
  const hrs = m => (m/60).toFixed(1);

  // ---- PIE CHART (canvas) ----
  let h = '<div style="display:flex;flex-wrap:wrap;gap:28px;padding:24px;overflow-y:auto;height:100%;box-sizing:border-box;align-content:flex-start">';
  h += '<div style="flex:0 0 auto"><div style="font-family:var(--mono);font-size:11px;color:var(--accent);letter-spacing:1px;margin-bottom:10px">// TIME BY CATEGORY — THIS WEEK</div>';
  h += '<canvas id="catPie" width="260" height="260" style="display:block"></canvas></div>';

  // ---- CATEGORY TABLE ----
  h += '<div style="flex:1 1 260px;min-width:250px"><div style="font-family:var(--mono);font-size:11px;color:var(--accent);letter-spacing:1px;margin-bottom:10px">// HOURS BY CATEGORY</div>';
  h += '<table style="width:100%;border-collapse:collapse;font-family:var(--mono);font-size:11px">';
  cats.forEach(c => {
    const hex = COLOR_HEX[c]||'#7dd8f0', lbl = CAT_LABEL[c]||'WORK';
    const pct = totalMin ? Math.round(catMin[c]/totalMin*100) : 0;
    h += '<tr style="border-bottom:1px solid var(--border)"><td style="padding:6px 8px"><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:'+hex+';margin-right:8px"></span>'+lbl+'</td><td style="padding:6px 8px;text-align:right;color:var(--text2)">'+hrs(catMin[c])+'h</td><td style="padding:6px 8px;text-align:right;color:var(--text3);width:52px">'+pct+'%</td></tr>';
  });
  h += '</table></div>';

  // ---- 8/8/8 BREAKDOWN ----
  const target = 8 * 7; // hours per week per bucket
  const bks = [['work','WORK','#7dd8f0'],['sleep','SLEEP','#a8b8e8'],['personal','PERSONAL / FREE','#7dddb0']];
  // Which categories belong in each bucket (built from BUCKET so it always matches the math)
  const bucketCats = { work:[], sleep:[], personal:[] };
  Object.keys(CAT_LABEL).forEach(c => { bucketCats[BUCKET[c]||'personal'].push(c); });
  h += '<div style="flex:1 1 100%;margin-top:8px"><div style="font-family:var(--mono);font-size:11px;color:var(--accent);letter-spacing:1px;margin-bottom:4px">// 8 / 8 / 8 RULE — 8H WORK · 8H SLEEP · 8H PERSONAL (PER DAY)</div>';
  h += '<div style="font-family:var(--mono);font-size:10px;color:var(--text3);margin-bottom:12px">TARGET: 56H PER WEEK EACH</div>';
  h += '<table style="width:100%;max-width:560px;border-collapse:collapse;font-family:var(--mono);font-size:11px">';
  bks.forEach(([k,lbl,hex]) => {
    const m = bucketMin[k], hh = m/60, diff = hh - target;
    const sign = diff >= 0 ? '+' : '';
    const col = diff >= 0 ? '#7dddb0' : '#f28b9a';
    const pctW = Math.min(100, Math.round(hh/(target*1.5)*100));
    const catList = bucketCats[k].map(c => CAT_LABEL[c]||c).join(' • ');
    h += '<tr style="border-bottom:1px solid var(--border)"><td style="padding:8px"><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:'+hex+';margin-right:8px"></span>'+lbl+'<div style="font-size:9px;color:var(--text3);margin-top:3px;letter-spacing:1px">'+catList+'</div></td>'
       + '<td style="padding:8px;text-align:right;color:var(--text2);width:80px">'+hh.toFixed(1)+'h / 56h</td>'
       + '<td style="padding:8px;text-align:right;width:80px;color:'+col+';font-weight:700">'+sign+diff.toFixed(1)+'h</td></tr>'
       + '<tr><td colspan="3" style="padding:0 8px 10px"><div style="height:6px;background:var(--surface);border-radius:3px;overflow:hidden"><div style="height:100%;width:'+pctW+'%;background:'+hex+'"></div></div></td></tr>';
  });
  h += '</table></div></div>';
  mv.innerHTML = h;

  // Draw pie
  const cv = document.getElementById('catPie');
  if (cv && cv.getContext) {
    const ctx = cv.getContext('2d');
    const cx = 130, cy = 130, r = 118;
    let ang = -Math.PI/2;
    if (totalMin > 0) {
      cats.forEach(c => {
        const frac = catMin[c]/totalMin;
        const a2 = ang + frac*Math.PI*2;
        ctx.beginPath(); ctx.moveTo(cx,cy);
        ctx.arc(cx,cy,r,ang,a2); ctx.closePath();
        ctx.fillStyle = COLOR_HEX[c]||'#7dd8f0'; ctx.fill();
        ang = a2;
      });
    } else {
      ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2);
      ctx.fillStyle = '#1c2128'; ctx.fill();
    }
    ctx.beginPath(); ctx.arc(cx,cy,54,0,Math.PI*2);
    ctx.fillStyle = '#0d1117'; ctx.fill();
    ctx.fillStyle = '#8b949e'; ctx.font = '11px JetBrains Mono, monospace';
    ctx.textAlign = 'center';
    ctx.fillText((totalMin/60).toFixed(1)+'h', cx, cy-2);
    ctx.fillText('SCHEDULED', cx, cy+12);
  }
}

render();
</script>
